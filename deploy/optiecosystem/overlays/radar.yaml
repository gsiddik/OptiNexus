# Joins OptiRadar (server + OptiRadar Web) to the shared OptiEcosystem network at http://radar.<domain>:8082.
services:
  radar:
    networks:
      default: {}
      ecosystem:
        aliases: ["radar.${ECOSYSTEM_DOMAIN:-localtest.me}"]
networks:
  ecosystem:
    name: ${ECOSYSTEM_NETWORK:-optiecosystem}
    external: true
