# Joins OptiFleet to the shared OptiEcosystem network. The console (which proxies /api and /storage) answers at http://fleet.<domain>:<ui port>,
# the URL OptiEntry and the browser use; the PHP roles join the network to reach the OptiNexus issuer by its public name.
# The console reaches its API through a name that exists only in this product's own network: the generic service name `web` would also
# match OptiNexus's web container once both sit on the shared network.
services:
  web:
    networks:
      default:
        aliases: ["fleet-web"]
  ui:
    environment:
      API_UPSTREAM: http://fleet-web:${FLEET_API_PORT:-8000}
    networks:
      default: {}
      ecosystem:
        aliases: ["fleet.${ECOSYSTEM_DOMAIN:-localtest.me}"]
  api:
    networks: [default, ecosystem]
  worker:
    networks: [default, ecosystem]
  scheduler:
    networks: [default, ecosystem]
  bootstrap:
    networks: [default, ecosystem]
networks:
  ecosystem:
    name: ${ECOSYSTEM_NETWORK:-optiecosystem}
    external: true
