# Joins OptiStash to the shared OptiEcosystem network. The console (which proxies /api) answers at http://stash.<domain>:<ui port>, the URL
# the browser and OptiNexus (back-channel logout, event webhooks) use; the PHP roles join the network to reach the OptiNexus issuer by its
# public name (the scheduler too: it relays pickup requests to OptiNexus).
# The console reaches its API through a name that exists only in this product's own network: the generic service name `web` would also
# match OptiNexus's web container once both sit on the shared network.
services:
  web:
    networks:
      default:
        aliases: ["stash-web"]
  ui:
    environment:
      API_UPSTREAM: http://stash-web:${STASH_API_PORT:-8400}
    networks:
      default: {}
      ecosystem:
        aliases: ["stash.${ECOSYSTEM_DOMAIN:-localtest.me}"]
  api:
    networks: [default, ecosystem]
  scheduler:
    networks: [default, ecosystem]
  bootstrap:
    networks: [default, ecosystem]
networks:
  ecosystem:
    name: ${ECOSYSTEM_NETWORK:-optiecosystem}
    external: true
