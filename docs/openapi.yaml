          properties:
            data:
              type: object
              properties:
                tenant_id: { type: string, format: uuid }
                tenant_status: { type: string }
                subscriptions: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
                applications_enabled: { type: array, items: { type: string } }
                effective_entitlements: { type: array, items: { $ref: '#/components/schemas/EffectiveEntitlement' } }

    UsageEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid, nullable: true }
        meter_key: { type: string }
        quantity: { type: string }
        usage_timestamp: { type: string, format: date-time }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        source: { type: string, nullable: true }
        external_reference: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }
        metadata: { type: object, nullable: true }
    UsageEventInput:
      type: object
      required: [tenant_id, application_code, meter_key, quantity]
      properties:
        tenant_id: { type: string, format: uuid }
        application_code: { type: string }
        subscription_id: { type: string, format: uuid, nullable: true }
        meter_key: { type: string }
        quantity: { type: number, minimum: 0 }
        usage_timestamp: { type: string, format: date-time, nullable: true }
        period_start: { type: string, format: date-time, nullable: true }
        period_end: { type: string, format: date-time, nullable: true }
        external_reference: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true, description: "Guarantees a retried/duplicated report never double-bills" }
        metadata: { type: object, nullable: true }
    UsageEventResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties: { data: { $ref: '#/components/schemas/UsageEvent' } }
    PaginatedUsageEvents:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/UsageEvent' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } }

    BillingItemLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        subscription_item_id: { type: string, format: uuid, nullable: true }
        charge_type: { type: string, enum: [RECURRING, ADDON, USAGE, OVERAGE] }
        description: { type: string }
        quantity: { type: string }
        unit_amount: { type: string }
        subtotal: { type: string }
        discount_amount: { type: string }
        tax_amount: { type: string }
        total: { type: string }
        pricing_snapshot: { type: object, nullable: true, description: "The exact price definition used at calculation time - preserves historical accuracy even if the Price/Plan rows change later" }
    BillingAdjustment:
      type: object
      properties:
        id: { type: string, format: uuid }
        adjustment_type: { type: string, enum: [DISCOUNT, CREDIT, DEBIT, CORRECTION, ROUNDING] }
        reason: { type: string }
        amount: { type: string }
        status: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
    BillingAdjustmentInput:
      type: object
      required: [adjustment_type, reason, amount]
      properties:
        adjustment_type: { type: string, enum: [DISCOUNT, CREDIT, DEBIT, CORRECTION, ROUNDING] }
        reason: { type: string }
        amount: { type: string, description: "Signed decimal string, e.g. -100000.00 for a credit" }
    Billing:
      type: object
      description: "Immutable once FINALIZED - corrections are explicit BillingAdjustment records only."
      properties:
        id: { type: string, format: uuid }
        billing_number: { type: string }
        customer_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        currency: { type: string }
        subtotal: { type: string }
        discount_total: { type: string }
        tax_total: { type: string }
        adjustment_total: { type: string }
        total: { type: string }
        status: { type: string, enum: [DRAFT, CALCULATED, REVIEWED, FINALIZED, CANCELLED] }
        calculated_at: { type: string, format: date-time, nullable: true }
        finalized_at: { type: string, format: date-time, nullable: true }
        metadata: { type: object, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/BillingItemLine' } }
        adjustments: { type: array, items: { $ref: '#/components/schemas/BillingAdjustment' } }
    PaginatedBillings:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Billing' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } }
    BillingRunResult:
      oneOf:
        - $ref: '#/components/schemas/Billing'
        - type: object
          properties: { subscription_id: { type: string, format: uuid }, error: { type: string } }
    BillingRunResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties: { data: { type: object, properties: { results: { type: array, items: { $ref: '#/components/schemas/BillingRunResult' } } } } }

    InvoiceItemLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: string }
        unit_amount: { type: string }
        subtotal: { type: string }
        discount_amount: { type: string }
        tax_amount: { type: string }
        total: { type: string }
        source_billing_item_id: { type: string, format: uuid, nullable: true }
    InvoicePayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: string }
        paid_at: { type: string, format: date-time }
        method: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        recorded_by: { type: string, format: uuid, nullable: true }
    Invoice:
      type: object
      description: "A frozen financial snapshot of its source Billing, immutable once issued. invoice_number is always server-generated (PostgreSQL sequence), never client-supplied."
      properties:
        id: { type: string, format: uuid }
        invoice_number: { type: string }
        billing_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        issue_date: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date }
        currency: { type: string }
        subtotal: { type: string }
        discount_total: { type: string }
        tax_total: { type: string }
        adjustment_total: { type: string }
        total: { type: string }
        balance_due: { type: string }
        status: { type: string, enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, VOID, CANCELLED] }
        issued_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        metadata: { type: object, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/InvoiceItemLine' } }
        payments: { type: array, items: { $ref: '#/components/schemas/InvoicePayment' } }
    PaginatedInvoices:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } }

    # ------------------------------------------------- Phase 3 Orchestration
    ConditionDefinition:
      type: object
      description: >
        Safe declarative condition grammar shared by Policy and Workflow
        transitions - no expressions, no code execution. Either a
        combinator ("all"/"any"/"not" of nested conditions) or a leaf
        {field, operator, value|eq_context}. operator is one of eq, ne,
        gt, gte, lt, lte, in, not_in, contains, eq_context, ne_context.
      example: { field: "context.amount", operator: "lte", value: 100 }
    Policy:
      type: object
      properties:
        id: { type: string, format: uuid }
        policy_code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        policy_type: { type: string, enum: [AUTHORIZATION, WORKFLOW_ROUTING, APPROVAL, FEATURE, INTEGRATION, COMMERCIAL, SECURITY] }
        tenant_id: { type: string, format: uuid, nullable: true }
        application_id: { type: string, format: uuid, nullable: true }
        priority: { type: integer, default: 100 }
        effect: { type: string, enum: [ALLOW, DENY, MATCH] }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, DEPRECATED] }
        condition_definition: { $ref: '#/components/schemas/ConditionDefinition' }
        effective_from: { type: string, format: date-time, nullable: true }
        effective_until: { type: string, format: date-time, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    PolicyInput:
      type: object
      required: [policy_code, name, policy_type, effect, condition_definition]
      properties:
        policy_code: { type: string }
        name: { type: string }
        description: { type: string }
        policy_type: { type: string, enum: [AUTHORIZATION, WORKFLOW_ROUTING, APPROVAL, FEATURE, INTEGRATION, COMMERCIAL, SECURITY] }
        tenant_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        priority: { type: integer }
        effect: { type: string, enum: [ALLOW, DENY, MATCH] }
        condition_definition: { $ref: '#/components/schemas/ConditionDefinition' }
        effective_from: { type: string, format: date-time }
        effective_until: { type: string, format: date-time }
    PaginatedPolicies:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Policy' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    PolicySimulateInput:
      type: object
      description: Never executes side effects - a pure read against ACTIVE policies.
      properties:
        policy_type: { type: string }
        tenant_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        permission: { type: string }
        action: { type: string }
        actor: { type: object }
        resource: { type: object }
        context: { type: object }
    PolicySimulationResult:
      type: object
      properties:
        decision: { type: string, enum: [ALLOW, DENY, NEUTRAL] }
        effect: { type: string }
        reason_code: { type: string, enum: [POLICY_EXPLICIT_DENY, POLICY_ALLOW, POLICY_NO_MATCH] }
        matched_policies:
          type: array
          items:
            type: object
            properties: { id: { type: string, format: uuid }, policy_code: { type: string }, effect: { type: string }, priority: { type: integer }, version: { type: integer } }

    WorkflowStep:
      type: object
      properties:
        step_key: { type: string, pattern: '^[a-zA-Z0-9_]+$' }
        step_type: { type: string, enum: [START, CONDITION, TASK, APPROVAL, INTEGRATION, INTERNAL_ACTION, WAIT, END] }
        name: { type: string, nullable: true }
        config: { type: object, nullable: true, description: "Per-type: APPROVAL needs approval_definition_code; INTEGRATION needs integration_code+endpoint_key; INTERNAL_ACTION needs action (emit_event|no_op); WAIT needs duration_seconds." }
        sort_order: { type: integer }
    WorkflowTransition:
      type: object
      properties:
        from_step_key: { type: string }
        to_step_key: { type: string }
        condition: { $ref: '#/components/schemas/ConditionDefinition' }
        sort_order: { type: integer, description: "First matching transition wins; a transition with no condition always matches (default/fallback branch)." }
    WorkflowVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        activated_at: { type: string, format: date-time, nullable: true }
        steps: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' } }
        transitions: { type: array, items: { $ref: '#/components/schemas/WorkflowTransition' } }
    Workflow:
      type: object
      properties:
        id: { type: string, format: uuid }
        workflow_code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        tenant_id: { type: string, format: uuid, nullable: true }
        application_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, DEPRECATED] }
        current_version: { type: integer }
        trigger_type: { type: string, enum: [EVENT, API, MANUAL, SCHEDULED] }
        trigger_event_key: { type: string, nullable: true }
        draft_version: { $ref: '#/components/schemas/WorkflowVersion' }
        created_at: { type: string, format: date-time }
    WorkflowInput:
      type: object
      required: [workflow_code, name, trigger_type, steps]
      properties:
        workflow_code: { type: string }
        name: { type: string }
        description: { type: string }
        tenant_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        trigger_type: { type: string, enum: [EVENT, API, MANUAL, SCHEDULED] }
        trigger_event_key: { type: string, description: "Required when trigger_type is EVENT; must reference an existing event_catalog entry." }
        steps: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' }, minItems: 1 }
        transitions: { type: array, items: { $ref: '#/components/schemas/WorkflowTransition' } }
    PaginatedWorkflows:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Workflow' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    WorkflowInstanceStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        workflow_step_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, RUNNING, WAITING, COMPLETED, FAILED, SKIPPED, CANCELLED] }
        attempt_count: { type: integer }
        output: { type: object, nullable: true, description: "Available to downstream CONDITION transitions as steps.<step_key>.*" }
        last_error_code: { type: string, nullable: true }
        last_error_message: { type: string, nullable: true, description: Sanitized - long base64-like substrings are redacted before storage. }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
    WorkflowInstance:
      type: object
      properties:
        id: { type: string, format: uuid }
        workflow_id: { type: string, format: uuid }
        workflow_version_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true }
        application_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [PENDING, RUNNING, WAITING, WAITING_APPROVAL, COMPLETED, FAILED, CANCELLED] }
        trigger_type: { type: string }
        trigger_event_id: { type: string, format: uuid, nullable: true }
        trigger_payload: { type: object, nullable: true }
        correlation_id: { type: string, nullable: true }
        causation_id: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }
        last_error_code: { type: string, nullable: true }
        last_error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        steps: { type: array, items: { $ref: '#/components/schemas/WorkflowInstanceStep' } }
    PaginatedWorkflowInstances:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/WorkflowInstance' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]

    ApprovalLevel:
      type: object
      properties:
        level_order: { type: integer }
        name: { type: string }
        approver_type: { type: string, enum: [USER, ROLE, TENANT_ROLE, APPLICATION_ROLE, DYNAMIC] }
        approver_reference: { type: string, nullable: true, description: "A user id for USER/DYNAMIC; a role code for ROLE/TENANT_ROLE/APPLICATION_ROLE." }
        condition: { $ref: '#/components/schemas/ConditionDefinition' }
    ApprovalDefinition:
      type: object
      properties:
        id: { type: string, format: uuid }
        definition_code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        tenant_id: { type: string, format: uuid, nullable: true }
        application_id: { type: string, format: uuid, nullable: true }
        rule_type: { type: string, enum: [SEQUENTIAL, ANY_OF, ALL_OF] }
        self_approval_allowed: { type: boolean }
        expires_after_hours: { type: integer, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
        levels: { type: array, items: { $ref: '#/components/schemas/ApprovalLevel' } }
        created_at: { type: string, format: date-time }
    ApprovalDefinitionInput:
      type: object
      required: [definition_code, name, levels]
      properties:
        definition_code: { type: string }
        name: { type: string }
        description: { type: string }
        tenant_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        rule_type: { type: string, enum: [SEQUENTIAL, ANY_OF, ALL_OF], default: SEQUENTIAL }
        self_approval_allowed: { type: boolean, default: false }
        expires_after_hours: { type: integer }
        levels: { type: array, items: { $ref: '#/components/schemas/ApprovalLevel' }, minItems: 1, description: "level_order values must be unique." }
    PaginatedApprovalDefinitions:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ApprovalDefinition' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    ApprovalDecision:
      type: object
      description: Immutable once recorded - update/delete are blocked at the model level.
      properties:
        id: { type: string, format: uuid }
        decision: { type: string, enum: [APPROVE, REJECT, RETURN] }
        comment: { type: string, nullable: true }
        decided_by: { type: string, format: uuid, nullable: true }
        decided_at: { type: string, format: date-time }
    ApprovalRequestStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        level_order: { type: integer }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, RETURNED, SKIPPED] }
        resolved_approver_user_id: { type: string, format: uuid, nullable: true }
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
    ApprovalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        approval_definition_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true }
        application_id: { type: string, format: uuid, nullable: true }
        workflow_instance_id: { type: string, format: uuid, nullable: true }
        requested_by: { type: string, format: uuid, nullable: true }
        subject_type: { type: string, nullable: true }
        subject_id: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, IN_PROGRESS, APPROVED, REJECTED, RETURNED, CANCELLED, EXPIRED] }
        current_level: { type: integer }
        context: { type: object, nullable: true }
        correlation_id: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        steps: { type: array, items: { $ref: '#/components/schemas/ApprovalRequestStep' } }
        created_at: { type: string, format: date-time }
    PaginatedApprovalRequests:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ApprovalRequest' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    ApprovalDecisionInput:
      type: object
      properties: { comment: { type: string, nullable: true } }
    ApprovalDelegation:
      type: object
      properties:
        id: { type: string, format: uuid }
        delegator_user_id: { type: string, format: uuid }
        delegate_user_id: { type: string, format: uuid }
        approval_definition_id: { type: string, format: uuid, nullable: true, description: "Null delegates across every definition." }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
    ApprovalDelegationInput:
      type: object
      required: [delegate_user_id]
      properties:
        delegate_user_id: { type: string, format: uuid }
        approval_definition_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    IntegrationEndpoint:
      type: object
      properties:
        endpoint_key: { type: string }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path: { type: string }
    Integration:
      type: object
      properties:
        id: { type: string, format: uuid }
        integration_code: { type: string }
        name: { type: string }
        tenant_id: { type: string, format: uuid, nullable: true }
        source_application_id: { type: string, format: uuid }
        target_application_id: { type: string, format: uuid, nullable: true }
        integration_type: { type: string, enum: [REST, WEBHOOK, EVENT, INTERNAL] }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
        base_url: { type: string, nullable: true }
        timeout_seconds: { type: integer }
        retry_policy: { type: object, nullable: true }
        metadata: { type: object, nullable: true }
        endpoints: { type: array, items: { $ref: '#/components/schemas/IntegrationEndpoint' } }
        has_active_credential: { type: boolean }
        created_at: { type: string, format: date-time }
    IntegrationInput:
      type: object
      required: [integration_code, name, source_application_id, integration_type]
      properties:
        integration_code: { type: string }
        name: { type: string }
        source_application_id: { type: string, format: uuid }
        target_application_id: { type: string, format: uuid }
        integration_type: { type: string, enum: [REST, WEBHOOK, EVENT, INTERNAL] }
        base_url: { type: string, description: "HTTPS required for production external endpoints." }
        timeout_seconds: { type: integer, default: 30 }
        retry_policy: { type: object }
        endpoints: { type: array, items: { $ref: '#/components/schemas/IntegrationEndpoint' } }
    PaginatedIntegrations:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Integration' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    IntegrationCredential:
      type: object
      description: The plaintext secret is never returned by any endpoint, including this one, after creation.
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        credential_type: { type: string, enum: [API_KEY, BEARER, BASIC, OAUTH2] }
        reference_label: { type: string }
        status: { type: string, enum: [ACTIVE, ROTATED, REVOKED] }
        rotated_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    IntegrationCredentialInput:
      type: object
      required: [credential_type, secret, reference_label]
      properties:
        credential_type: { type: string, enum: [API_KEY, BEARER, BASIC, OAUTH2] }
        secret: { type: string, format: password, description: "Encrypted at rest immediately; never echoed back." }
        reference_label: { type: string }
    IntegrationLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        correlation_id: { type: string, nullable: true }
        direction: { type: string, enum: [OUTBOUND, INBOUND] }
        request_summary: { type: object, nullable: true }
        response_status: { type: integer, nullable: true }
        response_summary: { type: object, nullable: true }
        duration_ms: { type: integer, nullable: true }
        status: { type: string, enum: [PENDING, SUCCESS, FAILED, TIMEOUT] }
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        attempt_count: { type: integer }
        next_retry_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    PaginatedIntegrationLogs:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/IntegrationLog' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    IntegrationTestResult:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        log_id: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true }

    EventCatalogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_key: { type: string, description: "{domain}.{resource}.{event} convention." }
        application_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        schema_version: { type: string }
        payload_schema: { type: object, nullable: true, description: "Minimal JSON-Schema-like: required[] + properties.*.type." }
        status: { type: string, enum: [ACTIVE, DEPRECATED, DISABLED] }
    EventCatalogEntryInput:
      type: object
      required: [event_key, name, schema_version]
      properties:
        event_key: { type: string, pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)+$' }
        application_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        schema_version: { type: string }
        payload_schema: { type: object }
    PaginatedEventCatalogEntries:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/EventCatalogEntry' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    EventEnvelope:
      type: object
      description: >
        Trusted M2M ingestion payload. event_id is client-suppliable for
        idempotent retries (server-generated if omitted); the same
        event_id with identical event_key+data replays the original
        record (200), with different data it is EVENT_DUPLICATE (409).
      required: [event_key, data]
      properties:
        event_id: { type: string, format: uuid }
        event_key: { type: string }
        event_version: { type: string }
        occurred_at: { type: string, format: date-time }
        tenant_id: { type: string, format: uuid, nullable: true }
        correlation_id: { type: string }
        causation_id: { type: string, nullable: true }
        data: { type: object, description: "Up to 64KB; validated against the catalog entry's payload_schema." }
    Event:
      type: object
      properties:
        id: { type: string, format: uuid, description: "The primary key IS the event_id." }
        event_key: { type: string }
        event_version: { type: string }
        occurred_at: { type: string, format: date-time }
        source_application_id: { type: string, format: uuid, nullable: true }
        tenant_id: { type: string, format: uuid, nullable: true }
        correlation_id: { type: string, nullable: true }
        causation_id: { type: string, nullable: true }
        data: { type: object }
        created_at: { type: string, format: date-time }
    EventDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        consumer_type: { type: string, enum: [WORKFLOW, NOTIFICATION, WEBHOOK, INTEGRATION] }
        consumer_reference: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, DELIVERED, FAILED, DISCARDED] }
        attempt_count: { type: integer }
        last_error_code: { type: string, nullable: true }
        last_error_message: { type: string, nullable: true }
        next_retry_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    PaginatedEventDeliveries:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/EventDelivery' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]

    FeatureFlagOverride:
      type: object
      properties:
        id: { type: string, format: uuid }
        feature_flag_id: { type: string, format: uuid }
        scope_type: { type: string, enum: [GLOBAL, APPLICATION, TENANT, USER] }
        scope_id: { type: string, format: uuid, nullable: true, description: "Null only for GLOBAL scope." }
        value: {}
        effective_from: { type: string, format: date-time, nullable: true }
        effective_until: { type: string, format: date-time, nullable: true }
    FeatureFlagOverrideInput:
      type: object
      required: [scope_type, value]
      properties:
        scope_type: { type: string, enum: [GLOBAL, APPLICATION, TENANT, USER] }
        scope_id: { type: string, format: uuid, description: "Required unless scope_type is GLOBAL. Must not reference a tenant unrelated to the flag's own application." }
        value: {}
        effective_from: { type: string, format: date-time }
        effective_until: { type: string, format: date-time }
    FeatureFlag:
      type: object
      properties:
        id: { type: string, format: uuid }
        flag_key: { type: string }
        application_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        flag_type: { type: string, enum: [BOOLEAN, STRING, NUMBER, JSON] }
        default_value: {}
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
        overrides: { type: array, items: { $ref: '#/components/schemas/FeatureFlagOverride' } }
        created_at: { type: string, format: date-time }
    FeatureFlagInput:
      type: object
      required: [flag_key, name, flag_type, default_value]
      properties:
        flag_key: { type: string }
        application_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        flag_type: { type: string, enum: [BOOLEAN, STRING, NUMBER, JSON] }
        default_value: {}
    PaginatedFeatureFlags:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/FeatureFlag' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    FeatureFlagEvaluateInput:
      type: object
      required: [flag_key]
      properties:
        flag_key: { type: string }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
    FeatureFlagEvaluation:
      type: object
      description: "Precedence: USER > TENANT > APPLICATION > GLOBAL override > GLOBAL default."
      properties:
        enabled: { type: boolean }
        value: {}
        source: { type: string, enum: [USER, TENANT, APPLICATION, GLOBAL, GLOBAL_DEFAULT, FLAG_INACTIVE] }

    NotificationTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        template_code: { type: string }
        name: { type: string }
        channel: { type: string, enum: [EMAIL, IN_APP, WEBHOOK] }
        subject_template: { type: string, nullable: true }
        body_template: { type: string, description: "Only {{ dot.path }} placeholders are substituted as plain text - no server-side code execution." }
        language: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
        created_at: { type: string, format: date-time }
    NotificationTemplateInput:
      type: object
      required: [template_code, name, channel, body_template]
      properties:
        template_code: { type: string }
        name: { type: string }
        channel: { type: string, enum: [EMAIL, IN_APP, WEBHOOK] }
        subject_template: { type: string }
        body_template: { type: string }
        language: { type: string, default: en }
    NotificationTemplateUpdateInput:
      type: object
      description: Editing body_template/subject_template bumps version.
      properties:
        name: { type: string }
        subject_template: { type: string, nullable: true }
        body_template: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
    PaginatedNotificationTemplates:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationTemplate' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    NotificationRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        rule_code: { type: string }
        name: { type: string }
        tenant_id: { type: string, format: uuid, nullable: true }
        application_id: { type: string, format: uuid, nullable: true }
        trigger_event_key: { type: string, nullable: true }
        condition: { $ref: '#/components/schemas/ConditionDefinition' }
        recipient_type: { type: string, enum: [SPECIFIC_USER, ROLE_MEMBERS, TENANT_ADMINS, CUSTOMER_ADMINS, APPLICATION_ADMINS, ACTOR, RESOURCE_OWNER, EVENT_CONTEXT] }
        recipient_reference: { type: string, nullable: true, description: "A user id, role code, or (EVENT_CONTEXT only) a data.* dot-path into the trusted event payload." }
        notification_template_id: { type: string, format: uuid }
        channel: { type: string, enum: [EMAIL, IN_APP, WEBHOOK] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        created_at: { type: string, format: date-time }
    NotificationRuleInput:
      type: object
      required: [rule_code, name, recipient_type, notification_template_id, channel]
      properties:
        rule_code: { type: string }
        name: { type: string }
        tenant_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        trigger_event_key: { type: string }
        condition: { $ref: '#/components/schemas/ConditionDefinition' }
        recipient_type: { type: string, enum: [SPECIFIC_USER, ROLE_MEMBERS, TENANT_ADMINS, CUSTOMER_ADMINS, APPLICATION_ADMINS, ACTOR, RESOURCE_OWNER, EVENT_CONTEXT] }
        recipient_reference: { type: string }
        notification_template_id: { type: string, format: uuid }
        channel: { type: string, enum: [EMAIL, IN_APP, WEBHOOK] }
    PaginatedNotificationRules:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationRule' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    NotificationDelivery:
      type: object
      properties:
        attempt_number: { type: integer }
        status: { type: string, enum: [SUCCESS, FAILED] }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true }
        application_id: { type: string, format: uuid, nullable: true }
        notification_rule_id: { type: string, format: uuid, nullable: true }
        notification_template_id: { type: string, format: uuid, nullable: true }
        recipient_user_id: { type: string, format: uuid, nullable: true }
        channel: { type: string, enum: [EMAIL, IN_APP, WEBHOOK] }
        subject: { type: string, nullable: true }
        body: { type: string }
        status: { type: string, enum: [QUEUED, PROCESSING, SENT, FAILED, CANCELLED] }
        correlation_id: { type: string, nullable: true }
        causation_id: { type: string, nullable: true }
        attempt_count: { type: integer }
        last_error_code: { type: string, nullable: true }
        last_error_message: { type: string, nullable: true }
        next_retry_at: { type: string, format: date-time, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        deliveries: { type: array, items: { $ref: '#/components/schemas/NotificationDelivery' } }
        created_at: { type: string, format: date-time }
    PaginatedNotifications:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Notification' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } ]
    NotificationSendInput:
      type: object
      required: [template_code, recipient_user_ids]
      properties:
        template_code: { type: string }
        recipient_user_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
        context: { type: object }
        tenant_id: { type: string, format: uuid, description: "When set, every recipient must already belong to this tenant." }
        application_id: { type: string, format: uuid }
        correlation_id: { type: string }

    AccessEvaluateInput:
      type: object
      required: [user_id, application_code, permission]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        application_code: { type: string }
        permission: { type: string }
        entitlement_key: { type: string }
        feature_flag_key: { type: string }
        action: { type: string }
        resource_context: { type: object }
    AccessEvaluation:
      type: object
      description: "Never exposes matched policy detail or role/permission internals - only booleans and a reason code."
      properties:
        allowed: { type: boolean }
        checks:
          type: object
          properties: { entitlement: { type: boolean }, permission: { type: boolean }, policy: { type: boolean }, feature_flag: { type: boolean } }
        reason_code: { type: string, nullable: true }
    OidcDiscovery:
      type: object
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        userinfo_endpoint: { type: string }
        jwks_uri: { type: string }
        end_session_endpoint: { type: string }
        backchannel_logout_supported: { type: boolean }
        backchannel_logout_session_supported: { type: boolean }
        backchannel_logout_events_supported: { type: array, items: { type: string, format: uri } }
    OidcTokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer }
        id_token: { type: string, description: "RS256 JWT. Verify signature (JWKS), iss, aud, exp and nonce." }
        scope: { type: string }
    OidcClaims:
      type: object
      description: "Claims in the id_token and userinfo."
      properties:
        sub: { type: string, format: uuid, description: "Stable OptiNexus user id - use this, not the email, to link accounts." }
        sid: { type: string, format: uuid, description: "id_token only. Identifies this sign-in at OptiNexus; kept for logging and support. See Back-Channel Logout." }
        email: { type: string }
        email_verified: { type: boolean }
        name: { type: string }
        preferred_username: { type: string }
        tenant_id: { type: string, format: uuid, description: "The organization this sign-in is for. Never trust a tenant from anywhere else." }
        tenant_code: { type: string }
        tenant_name: { type: string }
        groups: { type: array, items: { type: string }, description: "Codes of the applications the user may open in this tenant" }
        apps:
          type: array
          items:
            type: object
            properties: { code: { type: string }, name: { type: string }, launch_url: { type: string, nullable: true } }
    OidcClientInput:
      type: object
      required: [application_id, name, redirect_uris]
      properties:
        application_id: { type: string, format: uuid }
        name: { type: string }
        redirect_uris: { type: array, items: { type: string, format: uri }, minItems: 1 }
        post_logout_redirect_uris: { type: array, items: { type: string, format: uri } }
        launch_url: { type: string, format: uri, nullable: true }
        backchannel_logout_uri:
          type: string
          format: uri
          nullable: true
          description: "Where OptiNexus POSTs a signed `logout_token` when the user logs out anywhere or loses access (OIDC Back-Channel Logout 1.0). Leave empty and the application is not notified."
        confidential: { type: boolean, default: true }
        require_pkce: { type: boolean, default: false }
    GatewayPublishVehicles:
      type: object
      required: [vehicles]
      properties:
        vehicles:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [id, registration_number]
            properties:
              id: { type: string, description: "The fleet application's own vehicle id" }
              registration_number: { type: string }
              vin: { type: string, nullable: true }
              status: { type: string, nullable: true }
    GatewayIngestReadings:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [device_ref, odometer_km, recorded_at]
            properties:
              device_ref: { type: string }
              odometer_km: { type: number, minimum: 0, description: "Kilometres" }
              odometer_kind: { type: string, enum: [DEVICE_ODOMETER, GPS_DISTANCE], default: DEVICE_ODOMETER, description: "GPS_DISTANCE = distance accumulated by the tracker since installation; consumers should calibrate it against their own odometer." }
              recorded_at: { type: string, format: date-time }
              device_name: { type: string, nullable: true }
              registration_number: { type: string, nullable: true, description: "Used for automatic matching to a fleet vehicle" }
    GatewayFeed:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  reading_id: { type: string, format: uuid }
                  vehicle_id: { type: string, description: "The fleet application's own vehicle id" }
                  registration_number: { type: string }
                  odometer_km: { type: string, example: "12500.50" }
                  odometer_kind: { type: string, enum: [DEVICE_ODOMETER, GPS_DISTANCE] }
                  recorded_at: { type: string, format: date-time }
                  source: { type: string, example: optiradar }
                  device_ref: { type: string }
            next_cursor: { type: string }
