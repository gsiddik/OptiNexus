openapi: 3.0.3
info:
  title: CGO Governance & Commercial Core API
  version: "1.1.0"
  description: |
    Central Governance & Orchestration (CGO) API — Phase 1 Governance Core plus
    Phase 2 SaaS Commercial Core.

    CGO is the central control plane for customer, tenant, application, capability,
    permission, role, user, and audit governance across the OptiNexus platform, and
    (as of Phase 2) the commercial system of record for what each tenant has bought
    (Product/Plan/Add-on/Subscription), what is enabled for them (Entitlement,
    deliberately independent of RBAC Permission), how much they owe (Pricing/Usage/
    Billing), and what they are invoiced (Invoice). Integrated applications
    (OptiFleet, OptiAccounting, Vehicle Maintenance System, Taxi Management, and
    future systems) use this API to validate tenants, register applications/
    capabilities, resolve identities, check authorization, check entitlements, read
    a tenant's commercial context, and report metered usage.

    ## Authentication
    Two distinct authentication mechanisms are supported:

    - **Human users** (the CGO admin SPA, or a human operator) authenticate with
      `POST /api/v1/auth/login` and receive a Laravel Sanctum bearer token
      (`Authorization: Bearer <token>`).
    - **Browser sign-in for integrated applications (SSO)** uses OpenID Connect
      against OptiNexus as the identity provider (see the `SSO` tag and
      `docs/integration/INTEGRATION_GUIDE.md`).
    - **Machine-to-machine / integrated applications** authenticate using the
      OAuth 2.0 **Client Credentials** grant against `POST /api/v1/oauth/token`
      and receive a short-lived JWT bearer token scoped to specific capabilities
      (`authorization.check`, `governance.read`, `audit.write`, `introspect`, and
      as of Phase 2: `entitlement.check`, `commercial.read`, `usage.write`).

    ## Response envelope
    Every response uses a consistent envelope:

    ```json
    { "success": true, "data": { }, "meta": { } }
    { "success": false, "error": { "code": "VALIDATION_ERROR", "message": "...", "details": {} } }
    ```

    ## Error Code Compliance Mapping (Phase 2 closure review)
    Five Phase 2 error codes from the original specification were reviewed
    against the shipped implementation. None represent a client-facing
    condition not already communicated by an existing code, so none were
    added - adding a same-meaning alias would be redundant, not compliant:

    - **SUBSCRIPTION_ALREADY_ACTIVE** -> `INVALID_SUBSCRIPTION_TRANSITION`
      (409). Activating an already-ACTIVE subscription is one case of "the
      transition isn't allowed from the current status" - the same 409
      contract as every other disallowed subscription transition.
    - **SUBSCRIPTION_EXPIRED** -> `INVALID_SUBSCRIPTION_TRANSITION` (409)
      for lifecycle actions on an EXPIRED subscription (e.g. renew); for
      entitlement checks it is not an error at all - `POST
      /entitlements/check` correctly returns `200 {"allowed": false}`,
      never a rejection, because a check is a decision query, not a
      guarded mutation.
    - **PRICE_NOT_EFFECTIVE** -> no error is raised by design. Effective
      price resolution (`plan_id`/`addon_id` + tenant override + point in
      time) automatically excludes any price outside its
      effective_from/effective_until window when selecting which price to
      rate against; an ineffective price is never the one used, so there is
      no client request that could reference one and be rejected for it.
      Price Simulation and the Billing Calculation Engine share this same
      resolution logic, so a plan/add-on with no currently-effective price
      component simply omits that charge (or returns a 0.00 quote) rather
      than erroring.
    - **BILLING_CALCULATION_ERROR** -> `INTERNAL_ERROR` (500). Every
      arithmetic step in the Billing Calculation Engine runs through
      `App\Support\Money` (integer minor units, no floats), which cannot
      raise a domain-level calculation error; an unexpected failure here is
      a server bug, and - as with every other unhandled exception in this
      API - is deliberately reported as a generic 500 `INTERNAL_ERROR`
      rather than a specific code, so internal failure detail is never
      leaked to a client.
    - **FINANCIAL_RECORD_LOCKED** -> `BILLING_ALREADY_FINALIZED` (409) for
      Billing, `INVALID_INVOICE_TRANSITION` (409) for Invoice. Both are
      structurally reinforced: neither resource has a generic update
      endpoint at all (only specific, individually-guarded lifecycle
      transitions), so "locked" is enforced by the absence of a mutation
      path, not merely by a runtime check.

    ## Phase 3 Error Code Compliance Mapping
    Every mandated Phase 3 error code is emitted exactly as named, with
    three narrow exceptions where the shipped behavior is more specific
    (never less informative) than the mandated code:

    - **POLICY_DENIED** -> policy evaluation returns a `reason_code` of
      `POLICY_EXPLICIT_DENY` (an explicit DENY policy matched) or
      `POLICY_NO_MATCH` (no policy had an opinion) rather than one generic
      "denied" code, so a caller of `POST /policies/simulate` or
      `POST /access/evaluate` can distinguish "something explicitly
      forbade this" from "nothing granted it either" - useful information
      the single mandated code would have discarded.
    - **INTEGRATION_AUTH_FAILED** -> not distinguished from
      `INTEGRATION_DELIVERY_FAILED` today. The outbound HTTP client
      reports success/failure by status code family; a 401/403 from the
      target system is recorded in the `IntegrationLog` as a normal
      failed delivery. Reserved in the schema for a future release that
      inspects response status to separate "the target rejected our
      credential" from "the target call failed for any other reason."
    - **IDEMPOTENCY_CONFLICT** -> event replay uses `EVENT_DUPLICATE`
      specifically (same `event_id`, different payload); Workflow
      instance triggering and Notification dispatch instead replay the
      *existing* resource with a 200/201 rather than erroring at all,
      since a same-key retry that reproduces the original result is the
      correct idempotent behavior, not a conflict to report.
  contact:
    name: Platform Engineering

servers:
  - url: https://cgo.example.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Central login/logout, session context, token introspection
  - name: Customers
    description: Commercial/legal customer accounts
  - name: Tenants
    description: Tenant lifecycle and membership within a customer
  - name: Applications
    description: Application registry and lifecycle
  - name: Capabilities
    description: Hierarchical capability registry per application
  - name: Permissions
    description: Independent security permission registry
  - name: Roles
    description: RBAC role management and permission assignment
  - name: Users
    description: Identity, tenant membership, application access, role assignment
  - name: Authorization
    description: Cross-application authorization decisions (M2M)
  - name: Audit
    description: Immutable audit trail
  - name: Service Accounts
    description: OAuth2 client-credentials M2M credential management
  - name: Products
    description: "Phase 2 — commercial product catalog (bundles Applications + Capabilities)"
  - name: Plans
    description: "Phase 2 — pricing/limits/capability tiers under a Product"
  - name: Add-ons
    description: "Phase 2 — optional purchasable extensions to a Plan"
  - name: Pricing
    description: "Phase 2 — versioned prices, tiers, custom tenant overrides, and price simulation"
  - name: Subscriptions
    description: "Phase 2 — the tenant-level commercial contract and its lifecycle"
  - name: Entitlements
    description: "Phase 2 — what is enabled for a tenant, independent of RBAC Permission"
  - name: Usage
    description: "Phase 2 — metered usage ingestion (M2M) and query"
  - name: Billing
    description: "Phase 2 — deterministic billing calculation, review, finalization, and adjustments"
  - name: Invoices
    description: "Phase 2 — invoice generation from finalized billing and payment lifecycle"
  - name: Policies
    description: "Phase 3 — declarative contextual authorization/routing conditions, evaluated with explicit-deny precedence"
  - name: Workflows
    description: "Phase 3 — versioned process definitions (steps/transitions) that orchestrate approvals, integrations, and internal actions"
  - name: Workflow Instances
    description: "Phase 3 — running/completed executions of a Workflow, with full step history and correlation"
  - name: Approval Definitions
    description: "Phase 3 — the approval matrix (levels, approver resolution, rule type) for a business decision"
  - name: Approval Requests
    description: "Phase 3 — individual human-decision requests raised against an Approval Definition, plus delegation"
  - name: Integrations
    description: "Phase 3 — registry of how CGO communicates with external applications (endpoints, credentials, delivery logs)"
  - name: Events
    description: "Phase 3 — the event catalog (schema registry) and trusted M2M event ingestion"
  - name: Event Deliveries
    description: "Phase 3 — outbox-style fan-out of an ingested event to its Workflow/Notification consumers"
  - name: Feature Flags
    description: "Phase 3 — active capability/config toggles, independent of Entitlement/Permission/Capability Registry"
  - name: Notifications
    description: "Phase 3 — templates, trigger rules, and queued delivery across EMAIL/IN_APP/WEBHOOK channels"
  - name: Access
    description: "Phase 3 — aggregated effective-access evaluation (entitlement + permission + policy + feature flag)"
  - name: SSO
    description: "Platform integration — OpenID Connect provider (single sign-on for OptiFleet, OptiRadar and other apps)"
  - name: SSO Clients
    description: "Platform integration — registration of an application's OIDC client"
  - name: Gateway
    description: "Platform integration — machine API Gateway for cross-platform data exchange (fleet vehicles, telematics odometer)"
  - name: Gateway Admin
    description: "Platform integration — admin view of vehicle <-> device links and gateway call log"

security:
  - BearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Central login (human users)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          token_type: { type: string, example: Bearer }
                          user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the caller's current session token
      responses:
        '200': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/context:
    get:
      tags: [Auth]
      summary: Effective governance context for the authenticated user
      description: >
        Returns the authenticated user, their available tenants, roles, and
        effective permissions, optionally scoped to a tenant/application.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: application_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Governance context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/TenantAccessDenied' }
  /auth/introspect:
    post:
      tags: [Auth]
      summary: Validate a CGO-issued session token (RFC 7662-like)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '200':
          description: Introspection result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
  /oauth/token:
    post:
      tags: [Auth]
      summary: OAuth 2.0 Client Credentials token issuance (M2M)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string, format: uuid }
                client_secret: { type: string }
                scope:
                  type: string
                  description: Space-separated scopes
                  example: "authorization.check governance.read audit.write"
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
                  access_token: { type: string }

  # ------------------------------------------------------------ Customers
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': { $ref: '#/components/responses/CustomerList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Customers]
      summary: Create a customer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } }
      responses:
        '201': { $ref: '#/components/responses/CustomerItem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{customer}:
    parameters: [{ $ref: '#/components/parameters/CustomerId' }]
    get:
      tags: [Customers]
      summary: Get a customer
      responses:
        '200': { $ref: '#/components/responses/CustomerItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Customers]
      summary: Update a customer
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } }
      responses:
        '200': { $ref: '#/components/responses/CustomerItem' }
  /customers/{customer}/status:
    parameters: [{ $ref: '#/components/parameters/CustomerId' }]
    patch:
      tags: [Customers]
      summary: Generic status mutation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [ACTIVE, SUSPENDED, TERMINATED, ARCHIVED] } }
      responses:
        '200': { $ref: '#/components/responses/CustomerItem' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }
  /customers/{customer}/activate:
    parameters: [{ $ref: '#/components/parameters/CustomerId' }]
    post: { tags: [Customers], summary: Activate (from SUSPENDED), responses: { '200': { $ref: '#/components/responses/CustomerItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /customers/{customer}/suspend:
    parameters: [{ $ref: '#/components/parameters/CustomerId' }]
    post: { tags: [Customers], summary: Suspend (from ACTIVE), responses: { '200': { $ref: '#/components/responses/CustomerItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /customers/{customer}/terminate:
    parameters: [{ $ref: '#/components/parameters/CustomerId' }]
    post: { tags: [Customers], summary: Terminate (from ACTIVE/SUSPENDED), responses: { '200': { $ref: '#/components/responses/CustomerItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /customers/{customer}/archive:
    parameters: [{ $ref: '#/components/parameters/CustomerId' }]
    post: { tags: [Customers], summary: Archive (terminal), responses: { '200': { $ref: '#/components/responses/CustomerItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }

  # -------------------------------------------------------------- Tenants
  /tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      parameters:
        - $ref: '#/components/parameters/Status'
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/TenantList' } }
    post:
      tags: [Tenants]
      summary: Create a tenant (DRAFT)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TenantInput' } } } }
      responses: { '201': { $ref: '#/components/responses/TenantItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /tenants/{tenant}:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get: { tags: [Tenants], summary: Get a tenant, responses: { '200': { $ref: '#/components/responses/TenantItem' }, '403': { $ref: '#/components/responses/TenantAccessDenied' } } }
    put:
      tags: [Tenants]
      summary: Update a tenant
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TenantInput' } } } }
      responses: { '200': { $ref: '#/components/responses/TenantItem' } }
  /tenants/{tenant}/provision:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post: { tags: [Tenants], summary: "DRAFT → PROVISIONING", responses: { '200': { $ref: '#/components/responses/TenantItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /tenants/{tenant}/activate:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post: { tags: [Tenants], summary: "PROVISIONING → ACTIVE", responses: { '200': { $ref: '#/components/responses/TenantItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /tenants/{tenant}/suspend:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post: { tags: [Tenants], summary: "ACTIVE → SUSPENDED", responses: { '200': { $ref: '#/components/responses/TenantItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /tenants/{tenant}/reactivate:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post: { tags: [Tenants], summary: "SUSPENDED → ACTIVE", responses: { '200': { $ref: '#/components/responses/TenantItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /tenants/{tenant}/terminate:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post: { tags: [Tenants], summary: "ACTIVE/SUSPENDED → TERMINATED", responses: { '200': { $ref: '#/components/responses/TenantItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /tenants/{tenant}/archive:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post: { tags: [Tenants], summary: "TERMINATED → ARCHIVED", responses: { '200': { $ref: '#/components/responses/TenantItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /tenants/{tenant}/applications:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get: { tags: [Tenants], summary: List applications assigned to the tenant, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } } } }
  /tenants/{tenant}/applications/{application}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/ApplicationId' }
    post: { tags: [Tenants], summary: Assign an application to the tenant, responses: { '201': { description: Assigned }, '409': { $ref: '#/components/responses/Duplicate' } } }
    delete: { tags: [Tenants], summary: Remove an application from the tenant, responses: { '200': { description: Removed } } }
  /tenants/{tenant}/admins:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get: { tags: [Tenants], summary: List tenant admins, responses: { '200': { description: OK } } }
  /tenants/{tenant}/admins/{user}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/UserId' }
    post: { tags: [Tenants], summary: Grant tenant-admin, responses: { '201': { description: Granted } } }
    delete: { tags: [Tenants], summary: Revoke tenant-admin, responses: { '200': { description: Revoked } } }

  # ---------------------------------------------------------- Applications
  /applications:
    get:
      tags: [Applications]
      summary: List applications
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/ApplicationList' } }
    post:
      tags: [Applications]
      summary: Register an application (DRAFT)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationInput' } } } }
      responses: { '201': { $ref: '#/components/responses/ApplicationItem' } }
  /applications/{application}:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    get: { tags: [Applications], summary: Get an application, responses: { '200': { $ref: '#/components/responses/ApplicationItem' } } }
    put:
      tags: [Applications]
      summary: Update an application
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationInput' } } } }
      responses: { '200': { $ref: '#/components/responses/ApplicationItem' } }
  /applications/{application}/submit:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    post: { tags: [Applications], summary: "DRAFT → REVIEW", responses: { '200': { $ref: '#/components/responses/ApplicationItem' } } }
  /applications/{application}/approve:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    post: { tags: [Applications], summary: "REVIEW → APPROVED", responses: { '200': { $ref: '#/components/responses/ApplicationItem' } } }
  /applications/{application}/publish:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    post: { tags: [Applications], summary: "APPROVED → PUBLISHED", responses: { '200': { $ref: '#/components/responses/ApplicationItem' } } }
  /applications/{application}/deprecate:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    post: { tags: [Applications], summary: "PUBLISHED → DEPRECATED", responses: { '200': { $ref: '#/components/responses/ApplicationItem' } } }
  /applications/{application}/retire:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    post: { tags: [Applications], summary: "DEPRECATED/PUBLISHED → RETIRED", responses: { '200': { $ref: '#/components/responses/ApplicationItem' } } }
  /applications/{application}/capabilities:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    get:
      tags: [Capabilities]
      summary: List (or tree-view) an application's capabilities
      parameters:
        - { name: tree, in: query, schema: { type: boolean }, description: Return nested hierarchy }
        - { name: type, in: query, schema: { type: string, enum: [MODULE, MENU, SUBMENU, FEATURE, FUNCTION, ACTION] } }
      responses: { '200': { description: OK } }
    post:
      tags: [Capabilities]
      summary: Create a capability under this application
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CapabilityInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /applications/{application}/permissions:
    parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
    get: { tags: [Permissions], summary: List an application's permissions, responses: { '200': { description: OK } } }

  # ---------------------------------------------------------- Capabilities
  /capabilities/{capability}:
    parameters: [{ $ref: '#/components/parameters/CapabilityId' }]
    get: { tags: [Capabilities], summary: Get a capability (with children), responses: { '200': { description: OK } } }
    put:
      tags: [Capabilities]
      summary: Update a capability
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CapabilityUpdateInput' } } } }
      responses: { '200': { description: OK } }
    delete: { tags: [Capabilities], summary: Delete a leaf capability, responses: { '200': { description: Deleted }, '409': { description: Has children } } }
  /capabilities/{capability}/move:
    parameters: [{ $ref: '#/components/parameters/CapabilityId' }]
    post:
      tags: [Capabilities]
      summary: Move to a new parent (validates hierarchy)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { parent_id: { type: string, format: uuid, nullable: true } } }
      responses: { '200': { description: Moved }, '422': { $ref: '#/components/responses/ValidationError' } }
  /capabilities/{capability}/reorder:
    parameters: [{ $ref: '#/components/parameters/CapabilityId' }]
    post:
      tags: [Capabilities]
      summary: Change sibling sort order
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [sort_order], properties: { sort_order: { type: integer } } }
      responses: { '200': { description: Reordered } }
  /capabilities/{capability}/activate:
    parameters: [{ $ref: '#/components/parameters/CapabilityId' }]
    post: { tags: [Capabilities], summary: Activate, responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /capabilities/{capability}/disable:
    parameters: [{ $ref: '#/components/parameters/CapabilityId' }]
    post: { tags: [Capabilities], summary: Disable, responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /capabilities/{capability}/deprecate:
    parameters: [{ $ref: '#/components/parameters/CapabilityId' }]
    post: { tags: [Capabilities], summary: Deprecate, responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /capabilities/{capability}/permissions:
    parameters: [{ $ref: '#/components/parameters/CapabilityId' }]
    get: { tags: [Capabilities], summary: List permissions mapped to this capability, responses: { '200': { description: OK } } }
  /capabilities/{capability}/permissions/{permission}:
    parameters:
      - { $ref: '#/components/parameters/CapabilityId' }
      - { $ref: '#/components/parameters/PermissionId' }
    post: { tags: [Capabilities], summary: Map a permission to this capability, responses: { '201': { description: Mapped }, '422': { $ref: '#/components/responses/ValidationError' } } }
    delete: { tags: [Capabilities], summary: Unmap a permission, responses: { '200': { description: Unmapped } } }

  # ----------------------------------------------------------- Permissions
  /permissions:
    get:
      tags: [Permissions]
      summary: List permissions
      parameters:
        - { name: application_id, in: query, schema: { type: string, format: uuid } }
        - { name: capability_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string }, description: Filter by trailing .action segment }
        - { name: permission_key, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/PermissionList' } }
    post:
      tags: [Permissions]
      summary: Register a permission
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PermissionInput' } } } }
      responses: { '201': { $ref: '#/components/responses/PermissionItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /permissions/{permission}:
    parameters: [{ $ref: '#/components/parameters/PermissionId' }]
    get: { tags: [Permissions], summary: Get a permission, responses: { '200': { $ref: '#/components/responses/PermissionItem' } } }
    put:
      tags: [Permissions]
      summary: Update a permission
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string }, capability_id: { type: string, format: uuid, nullable: true } } } } } }
      responses: { '200': { $ref: '#/components/responses/PermissionItem' } }
  /permissions/{permission}/deprecate:
    parameters: [{ $ref: '#/components/parameters/PermissionId' }]
    post: { tags: [Permissions], summary: Deprecate (never hard-deleted), responses: { '200': { $ref: '#/components/responses/PermissionItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }

  # ----------------------------------------------------------------- Roles
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: application_id, in: query, schema: { type: string, format: uuid } }
        - { name: role_type, in: query, schema: { type: string, enum: [SYSTEM, APPLICATION, TENANT] } }
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/RoleList' } }
    post:
      tags: [Roles]
      summary: Create a role
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } } }
      responses: { '201': { $ref: '#/components/responses/RoleItem' } }
  /roles/{role}:
    parameters: [{ $ref: '#/components/parameters/RoleId' }]
    get: { tags: [Roles], summary: Get a role, responses: { '200': { $ref: '#/components/responses/RoleItem' } } }
    put:
      tags: [Roles]
      summary: Update a role
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/RoleItem' } }
  /roles/{role}/clone:
    parameters: [{ $ref: '#/components/parameters/RoleId' }]
    post:
      tags: [Roles]
      summary: Clone a role with its permission set
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name, code], properties: { name: { type: string }, code: { type: string } } }
      responses: { '201': { $ref: '#/components/responses/RoleItem' } }
  /roles/{role}/disable:
    parameters: [{ $ref: '#/components/parameters/RoleId' }]
    post: { tags: [Roles], summary: Disable a (non-system) role, responses: { '200': { $ref: '#/components/responses/RoleItem' }, '403': { description: System roles cannot be disabled } } }
  /roles/{role}/permissions:
    parameters: [{ $ref: '#/components/parameters/RoleId' }]
    get: { tags: [Roles], summary: List a role's permissions, responses: { '200': { $ref: '#/components/responses/PermissionList' } } }
  /roles/{role}/permissions/{permission}:
    parameters:
      - { $ref: '#/components/parameters/RoleId' }
      - { $ref: '#/components/parameters/PermissionId' }
    post:
      tags: [Roles]
      summary: Grant a permission to the role
      description: >
        The caller must already hold the permission being granted
        (in the same scope) — otherwise `PRIVILEGE_ESCALATION_DENIED`.
      responses:
        '201': { description: Granted }
        '403':
          description: Privilege escalation denied
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: PRIVILEGE_ESCALATION_DENIED, message: "You cannot grant a permission you do not hold yourself." } } } }
    delete: { tags: [Roles], summary: Revoke a permission from the role, responses: { '200': { description: Revoked } } }

  # ----------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/UserList' } }
    post:
      tags: [Users]
      summary: Create/invite a user (INVITED)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UserInput' } } } }
      responses: { '201': { $ref: '#/components/responses/UserItem' } }
  /users/{user}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get: { tags: [Users], summary: Get a user, responses: { '200': { $ref: '#/components/responses/UserItem' } } }
    put:
      tags: [Users]
      summary: Update a user
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, email: { type: string, format: email } } } } } }
      responses: { '200': { $ref: '#/components/responses/UserItem' } }
  /users/{user}/activate:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post: { tags: [Users], summary: "INVITED/SUSPENDED → ACTIVE", responses: { '200': { $ref: '#/components/responses/UserItem' } } }
  /users/{user}/suspend:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post: { tags: [Users], summary: "ACTIVE → SUSPENDED", responses: { '200': { $ref: '#/components/responses/UserItem' } } }
  /users/{user}/disable:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post: { tags: [Users], summary: "→ DISABLED (terminal)", responses: { '200': { $ref: '#/components/responses/UserItem' } } }
  /users/{user}/force-logout:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post:
      tags: [Users]
      summary: Sign the user out of every application and OptiNexus
      description: "Permission `cgo.user.session.revoke`. Same effect as a central logout, started by an administrator. Returns how many applications were notified."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { applications_notified: { type: integer } } } } } } } }
  /users/{user}/tenants:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get: { tags: [Users], summary: List tenant memberships, responses: { '200': { $ref: '#/components/responses/TenantList' } } }
  /users/{user}/tenants/{tenant}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
      - { $ref: '#/components/parameters/TenantId' }
    post: { tags: [Users], summary: Add tenant membership, responses: { '201': { description: Added }, '409': { $ref: '#/components/responses/Duplicate' } } }
    delete: { tags: [Users], summary: Remove tenant membership (cascades app access & roles in that tenant), responses: { '200': { description: Removed } } }
  /users/{user}/applications:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get: { tags: [Users], summary: List application access grants, responses: { '200': { $ref: '#/components/responses/ApplicationList' } } }
  /users/{user}/applications/{application}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
      - { $ref: '#/components/parameters/ApplicationId' }
    post:
      tags: [Users]
      summary: Grant application access (requires an active tenant membership)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [tenant_id], properties: { tenant_id: { type: string, format: uuid } } }
      responses: { '201': { description: Granted }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Users]
      summary: Revoke application access
      parameters: [{ name: tenant_id, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Revoked } }
  /users/{user}/roles:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      tags: [Users]
      summary: List assigned roles
      parameters: [{ name: tenant_id, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/RoleList' } }
  /users/{user}/roles/{role}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
      - { $ref: '#/components/parameters/RoleId' }
    post:
      tags: [Users]
      summary: Assign a role (TENANT/APPLICATION roles require tenant_id + active membership)
      description: >
        The caller cannot assign a role whose permission set exceeds their
        own effective permissions — otherwise `PRIVILEGE_ESCALATION_DENIED`.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { tenant_id: { type: string, format: uuid, nullable: true } } }
      responses:
        '201': { description: Assigned }
        '403': { description: Privilege escalation denied }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Users]
      summary: Revoke a role
      parameters: [{ name: tenant_id, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Revoked } }
  /users/{user}/effective-permissions:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      tags: [Users]
      summary: Resolve a user's effective permissions
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: application_id, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { description: OK } }

  # ------------------------------------------------------------ Authorization
  /authorization/check:
    post:
      tags: [Authorization]
      summary: Ask CGO whether an identity may perform an action (M2M only)
      description: >
        Machine-to-machine only. Requires a client-credentials access token
        carrying the `authorization.check` scope, issued to a registered
        Service Account. Evaluates authenticated identity, tenant
        membership, application access, role assignment, permission, scope,
        and account/tenant/application status.
      security: [{ OAuth2ClientCredentials: [authorization.check] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationCheckRequest' }
            example:
              user_id: "0699b1b1-6b1a-4e21-9a8e-7a9a6a2c6b31"
              tenant_id: "b1c2b1b1-6b1a-4e21-9a8e-7a9a6a2c6b31"
              application_code: optifleet
              permission: optifleet.vehicle.update
              resource_context: { resource_id: "veh-123" }
      responses:
        '200':
          description: Authorization decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationCheckResponse' }
              example: { success: true, data: { allowed: true, permission: optifleet.vehicle.update, scope: APPLICATION } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Audit
  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit log entries (admin, read-only)
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: application_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { description: OK } }
  /audit-logs/{auditLog}:
    parameters: [{ name: auditLog, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Audit], summary: Get a single audit log entry, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
  /audit-events:
    post:
      tags: [Audit]
      summary: Submit an audit event from a trusted integrated application (M2M only)
      description: >
        Requires a client-credentials token with the `audit.write` scope.
        The actor/application identity is derived from the authenticated
        service account, never from the request body, preventing actor
        spoofing. No PUT/DELETE exists for audit records anywhere in the API.
      security: [{ OAuth2ClientCredentials: [audit.write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditEventInput' }
      responses:
        '201': { description: Recorded }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "Application not assigned to the given tenant, or inactive service account" }

  # --------------------------------------------------------- Service Accounts
  /service-accounts:
    get: { tags: [Service Accounts], summary: List service accounts, responses: { '200': { description: OK } } }
    post:
      tags: [Service Accounts]
      summary: Create a service account (issues an OAuth2 client-credentials client)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                application_id: { type: string, format: uuid, nullable: true }
                tenant_id: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Created — client_secret is returned once and never retrievable again
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string, format: uuid }
                  client_secret: { type: string }
  /service-accounts/{serviceAccount}:
    parameters: [{ name: serviceAccount, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Service Accounts], summary: Get a service account, responses: { '200': { description: OK } } }
  /service-accounts/{serviceAccount}/rotate-secret:
    parameters: [{ name: serviceAccount, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Service Accounts], summary: Rotate the client secret (old secret invalidated immediately), responses: { '200': { description: New secret returned once } } }
  /service-accounts/{serviceAccount}/revoke:
    parameters: [{ name: serviceAccount, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Service Accounts], summary: Revoke credentials (revokes client + all outstanding tokens), responses: { '200': { description: Revoked } } }


  # ================================================================
  # Phase 2 — SaaS Commercial Core
  # ================================================================

  # ----------------------------------------------------------- Products
  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/ProductList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Products]
      summary: Create a product (DRAFT)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses: { '201': { $ref: '#/components/responses/ProductItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /products/{product}:
    parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Products], summary: Get a product, responses: { '200': { $ref: '#/components/responses/ProductItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Products]
      summary: Update a product
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses: { '200': { $ref: '#/components/responses/ProductItem' } }
  /products/{product}/activate:
    parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Products], summary: Activate (from DRAFT/INACTIVE), responses: { '200': { $ref: '#/components/responses/ProductItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /products/{product}/deactivate:
    parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Products], summary: Deactivate (from ACTIVE), responses: { '200': { $ref: '#/components/responses/ProductItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /products/{product}/retire:
    parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Products], summary: "Retire (from ACTIVE/INACTIVE, terminal)", responses: { '200': { $ref: '#/components/responses/ProductItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /products/{product}/applications:
    parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Products], summary: List applications bundled into this product, responses: { '200': { description: OK } } }
  /products/{product}/applications/{application}:
    parameters:
      - { name: product, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/ApplicationId' }
    post: { tags: [Products], summary: Assign an application to the product, responses: { '201': { description: Assigned }, '409': { $ref: '#/components/responses/Duplicate' } } }
    delete: { tags: [Products], summary: Revoke an application from the product, responses: { '200': { description: Revoked } } }
  /products/{product}/capabilities:
    parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Products], summary: List capabilities bundled into this product, responses: { '200': { description: OK } } }
  /products/{product}/capabilities/{capability}:
    parameters:
      - { name: product, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/CapabilityId' }
    post: { tags: [Products], summary: Assign a capability to the product, responses: { '201': { description: Assigned }, '409': { $ref: '#/components/responses/Duplicate' } } }
    delete: { tags: [Products], summary: Revoke a capability from the product, responses: { '200': { description: Revoked } } }

  # -------------------------------------------------------------- Plans
  /plans:
    get:
      tags: [Plans]
      summary: List plans
      parameters:
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Status'
        - { name: billing_interval, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/PlanList' } }
    post:
      tags: [Plans]
      summary: Create a plan (DRAFT)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } } }
      responses: { '201': { $ref: '#/components/responses/PlanItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /plans/{plan}:
    parameters: [{ name: plan, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Plans], summary: Get a plan, responses: { '200': { $ref: '#/components/responses/PlanItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Plans]
      summary: Update a plan
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } } }
      responses: { '200': { $ref: '#/components/responses/PlanItem' } }
  /plans/{plan}/clone:
    parameters: [{ name: plan, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Plans]
      summary: Clone a plan (new DRAFT copy, including capabilities and limits)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, plan_code], properties: { name: { type: string }, plan_code: { type: string } } }
      responses: { '201': { $ref: '#/components/responses/PlanItem' } }
  /plans/{plan}/activate:
    parameters: [{ name: plan, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Plans], summary: Activate (from DRAFT/INACTIVE), responses: { '200': { $ref: '#/components/responses/PlanItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /plans/{plan}/deactivate:
    parameters: [{ name: plan, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Plans], summary: Deactivate (from ACTIVE), responses: { '200': { $ref: '#/components/responses/PlanItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /plans/{plan}/retire:
    parameters: [{ name: plan, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Plans], summary: "Retire (from ACTIVE/INACTIVE, terminal)", responses: { '200': { $ref: '#/components/responses/PlanItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /plans/{plan}/capabilities:
    parameters: [{ name: plan, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Plans], summary: List capabilities included in this plan, responses: { '200': { description: OK } } }
  /plans/{plan}/capabilities/{capability}:
    parameters:
      - { name: plan, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/CapabilityId' }
    post: { tags: [Plans], summary: Include a capability in the plan, responses: { '201': { description: Assigned }, '409': { $ref: '#/components/responses/Duplicate' } } }
    delete: { tags: [Plans], summary: Remove a capability from the plan, responses: { '200': { description: Removed } } }
  /plans/{plan}/limits:
    parameters: [{ name: plan, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Plans], summary: List the plan's base limits, responses: { '200': { description: OK } } }
    post:
      tags: [Plans]
      summary: Configure (create or update) a base limit for this plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit_key]
              properties:
                limit_key: { type: string }
                limit_value: { type: number, nullable: true, description: "Required unless is_unlimited=true" }
                is_unlimited: { type: boolean, default: false }
                unit: { type: string, nullable: true }
      responses: { '200': { description: Limit configured, content: { application/json: { schema: { $ref: '#/components/schemas/PlanLimit' } } } } }
  /plans/{plan}/limits/{limit}:
    parameters:
      - { name: plan, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: path, required: true, schema: { type: string, format: uuid } }
    delete: { tags: [Plans], summary: Remove a limit from the plan, responses: { '200': { description: Removed }, '404': { $ref: '#/components/responses/NotFound' } } }

  # ------------------------------------------------------------ Add-ons
  /addons:
    get:
      tags: [Add-ons]
      summary: List add-ons
      parameters:
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/AddonList' } }
    post:
      tags: [Add-ons]
      summary: Create an add-on (DRAFT)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddonInput' } } } }
      responses: { '201': { $ref: '#/components/responses/AddonItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /addons/{addon}:
    parameters: [{ name: addon, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Add-ons], summary: Get an add-on, responses: { '200': { $ref: '#/components/responses/AddonItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Add-ons]
      summary: Update an add-on
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AddonInput' } } } }
      responses: { '200': { $ref: '#/components/responses/AddonItem' } }
  /addons/{addon}/activate:
    parameters: [{ name: addon, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Add-ons], summary: Activate (from DRAFT/INACTIVE), responses: { '200': { $ref: '#/components/responses/AddonItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /addons/{addon}/deactivate:
    parameters: [{ name: addon, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Add-ons], summary: Deactivate (from ACTIVE), responses: { '200': { $ref: '#/components/responses/AddonItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /addons/{addon}/retire:
    parameters: [{ name: addon, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Add-ons], summary: "Retire (from ACTIVE/INACTIVE, terminal)", responses: { '200': { $ref: '#/components/responses/AddonItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /addons/{addon}/capabilities:
    parameters: [{ name: addon, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Add-ons], summary: List capabilities included in this add-on, responses: { '200': { description: OK } } }
  /addons/{addon}/capabilities/{capability}:
    parameters:
      - { name: addon, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/CapabilityId' }
    post: { tags: [Add-ons], summary: Include a capability in the add-on, responses: { '201': { description: Assigned }, '409': { $ref: '#/components/responses/Duplicate' } } }
    delete: { tags: [Add-ons], summary: Remove a capability from the add-on, responses: { '200': { description: Removed } } }
  /addons/{addon}/limits:
    parameters: [{ name: addon, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Add-ons], summary: List the add-on's limit deltas, responses: { '200': { description: OK } } }
    post:
      tags: [Add-ons]
      summary: Configure (create or update) a limit delta for this add-on
      description: "Deltas are summed with the plan's base limit during effective-entitlement resolution (e.g. +50 vehicles)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit_key, limit_delta]
              properties:
                limit_key: { type: string }
                limit_delta: { type: number, description: "Signed delta, e.g. 50 or -10" }
                unit: { type: string, nullable: true }
      responses: { '200': { description: Limit configured, content: { application/json: { schema: { $ref: '#/components/schemas/AddonLimit' } } } } }

  # ------------------------------------------------------------ Pricing
  /prices:
    get:
      tags: [Pricing]
      summary: List prices
      description: "Ordered by effective_from descending. A price row is never overwritten - corrections are new, separately-effective rows."
      parameters:
        - { name: plan_id, in: query, schema: { type: string, format: uuid } }
        - { name: addon_id, in: query, schema: { type: string, format: uuid } }
        - { name: tenant_id, in: query, schema: { type: string, format: uuid }, description: "Filter to a tenant's custom override prices" }
        - $ref: '#/components/parameters/Status'
        - { name: price_type, in: query, schema: { $ref: '#/components/schemas/PriceType' } }
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/PriceList' } }
    post:
      tags: [Pricing]
      summary: Create a new global price version for a plan or add-on
      description: >
        Exactly one of plan_id/addon_id is required. Global prices (no
        tenant_id) are auto-approved. Use POST /pricing/overrides instead to
        create a tenant-specific custom price, which requires a separate
        approval step by a different user (segregation of duties).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriceInput' } } } }
      responses: { '201': { $ref: '#/components/responses/PriceItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /prices/{price}:
    parameters: [{ name: price, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Pricing], summary: "Get a price (with its tiers, if TIERED)", responses: { '200': { $ref: '#/components/responses/PriceItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Pricing]
      summary: Update a price's effective_until / metadata only
      description: "Amount and type are immutable once created - prices are versioned, not mutated. Issue a new price to correct an amount."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { effective_until: { type: string, format: date-time, nullable: true }, metadata: { type: object, nullable: true } }
      responses: { '200': { $ref: '#/components/responses/PriceItem' } }
  /prices/{price}/activate:
    parameters: [{ name: price, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Pricing]
      summary: Approve a pending custom tenant price override
      description: >
        Segregation of duties: the approver must be a different user than the
        price's creator, enforced server-side (403 UNAUTHORIZED otherwise,
        not merely a UI hint).
      responses:
        '200': { $ref: '#/components/responses/PriceItem' }
        '403': { description: "Approver is the same user as the creator", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: Already approved, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /prices/{price}/retire:
    parameters: [{ name: price, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Pricing], summary: Retire an active price (closes effective_until), responses: { '200': { $ref: '#/components/responses/PriceItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /pricing/simulate:
    post:
      tags: [Pricing]
      summary: Quote a plan/add-on combination without creating any billing record
      description: >
        Read-only. Shares the same rating engine as the real Billing
        Calculation Engine, so a quote here and the eventual charge for
        identical inputs always agree. Never writes a Billing or Invoice row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string, format: uuid }
                tenant_id: { type: string, format: uuid, nullable: true, description: "Resolves that tenant's custom price overrides, if any" }
                addon_ids: { type: array, items: { type: string, format: uuid } }
                quantities: { type: object, description: "meter_key/unit_name -> quantity, e.g. { vehicles: 125 }", additionalProperties: { type: number } }
      responses:
        '200':
          description: Simulated quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
              example:
                success: true
                data:
                  currency: IDR
                  subtotal: "2750000.00"
                  components:
                    - { code: platform_fee, price_id: "...", amount: "2000000.00" }
                    - { code: vehicles_fee, price_id: "...", amount: "750000.00", quantity: "125", included_quantity: "100.0000", billable_quantity: "25.0000", unit_amount: "30000.00" }
                  tax: "0.00"
                  total: "2750000.00"
  /pricing/overrides:
    post:
      tags: [Pricing]
      summary: Create a custom tenant-specific price override
      description: >
        Same shape as POST /prices, but tenant_id is required. Never modifies
        the global plan/add-on price - this always inserts a new row scoped
        to the tenant. Created as approval_status=PENDING_APPROVAL; a
        different user must approve it via POST /prices/{price}/activate.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriceInput' } } } }
      responses: { '201': { $ref: '#/components/responses/PriceItem' }, '422': { $ref: '#/components/responses/ValidationError' } }

  # ------------------------------------------------------- Subscriptions
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: List subscriptions
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: plan_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/SubscriptionList' } }
    post:
      tags: [Subscriptions]
      summary: Create a subscription (DRAFT)
      description: >
        Idempotent: a repeat POST carrying the same (tenant_id,
        idempotency_key) pair returns the original subscription (200) instead
        of creating a duplicate (201).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/SubscriptionItem' }
        '200': { description: "Idempotent replay - returns the existing subscription", content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } } ] } } } }
        '422':
          description: "PLAN_NOT_ACTIVE / PRODUCT_NOT_ACTIVE / TENANT_CUSTOMER_MISMATCH"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /subscriptions/{subscription}:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    get: { tags: [Subscriptions], summary: Get a subscription (with items), responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '403': { $ref: '#/components/responses/TenantAccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Subscriptions]
      summary: Update auto_renew / metadata only
      description: "Status, plan, and period fields are never editable here - only the explicit transition endpoints below may change them."
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { auto_renew: { type: boolean }, metadata: { type: object, nullable: true } } }
      responses: { '200': { $ref: '#/components/responses/SubscriptionItem' } }
  /subscriptions/{subscription}/start-trial:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post: { tags: [Subscriptions], summary: Start trial (from DRAFT; requires the plan to have trial_days configured), responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '422': { $ref: '#/components/responses/SubscriptionTransitionError' } } }
  /subscriptions/{subscription}/activate:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post:
      tags: [Subscriptions]
      summary: Activate (from DRAFT/TRIAL/SUSPENDED)
      description: "Generates (or restores) the tenant's PLAN/ADDON-sourced entitlements transactionally."
      responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } }
  /subscriptions/{subscription}/upgrade:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post:
      tags: [Subscriptions]
      summary: Change to a higher plan (from TRIAL/ACTIVE, same product only)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [plan_id], properties: { plan_id: { type: string, format: uuid } } } } } }
      responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } }
  /subscriptions/{subscription}/downgrade:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post:
      tags: [Subscriptions]
      summary: Change to a lower plan (from TRIAL/ACTIVE, same product only)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [plan_id], properties: { plan_id: { type: string, format: uuid } } } } } }
      responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } }
  /subscriptions/{subscription}/renew:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post: { tags: [Subscriptions], summary: Renew for the next billing period (from ACTIVE/PAST_DUE/GRACE_PERIOD), responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } } }
  /subscriptions/{subscription}/cancel:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post:
      tags: [Subscriptions]
      summary: Cancel (from any active-like status; terminal)
      description: "Revokes all PLAN/ADDON-sourced entitlements transactionally."
      responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } }
  /subscriptions/{subscription}/suspend:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post:
      tags: [Subscriptions]
      summary: Suspend (from ACTIVE/PAST_DUE/GRACE_PERIOD)
      description: "Suspends (does not revoke) the tenant's entitlements - reactivate restores them."
      responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } }
  /subscriptions/{subscription}/reactivate:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post: { tags: [Subscriptions], summary: Reactivate (from SUSPENDED only), responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } } }
  /subscriptions/{subscription}/expire:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post: { tags: [Subscriptions], summary: Expire (from TRIAL/ACTIVE/PAST_DUE/GRACE_PERIOD; terminal), responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } } }
  /subscriptions/{subscription}/terminate:
    parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
    post: { tags: [Subscriptions], summary: "Terminate (from any non-terminal status; terminal, immediate)", responses: { '200': { $ref: '#/components/responses/SubscriptionItem' }, '409': { $ref: '#/components/responses/SubscriptionTransitionError' } } }

  # ------------------------------------------------------- Entitlements
  /entitlements:
    get:
      tags: [Entitlements]
      summary: List entitlements (admin, cross-tenant)
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: subscription_id, in: query, schema: { type: string, format: uuid } }
        - { name: entitlement_type, in: query, schema: { type: string, enum: [APPLICATION, CAPABILITY, LIMIT] } }
        - $ref: '#/components/parameters/Status'
        - { name: source_type, in: query, schema: { type: string, enum: [PLAN, ADDON, MANUAL_OVERRIDE, SYSTEM] } }
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/EntitlementList' } }
  /entitlements/{entitlement}/suspend:
    parameters: [{ name: entitlement, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Entitlements], summary: Suspend an entitlement (from ACTIVE), responses: { '200': { $ref: '#/components/responses/EntitlementItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /entitlements/{entitlement}/restore:
    parameters: [{ name: entitlement, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [Entitlements], summary: Restore a suspended entitlement (from SUSPENDED), responses: { '200': { $ref: '#/components/responses/EntitlementItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /entitlements/check:
    post:
      tags: [Entitlements]
      summary: Ask CGO whether a tenant is entitled to an application/feature/limit (M2M only)
      description: >
        Machine-to-machine only. Requires a client-credentials token carrying
        the `entitlement.check` scope. This is deliberately independent of
        RBAC: Subscription answers "what was bought", Entitlement answers
        "what is enabled", Permission (see POST /authorization/check) answers
        "what a user may do". Returns a decision, never an error, for an
        unentitled tenant (allowed:false).
      security: [{ OAuth2ClientCredentials: [entitlement.check] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, application_code, entitlement_key]
              properties:
                tenant_id: { type: string, format: uuid }
                application_code: { type: string }
                entitlement_key: { type: string, example: vehicle_limit }
      responses:
        '200':
          description: Entitlement decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementCheckResponse' }
              example: { success: true, data: { allowed: true, entitlement_key: vehicle_limit, value: 100, source: PLAN } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
  /tenants/{tenant}/entitlements:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get: { tags: [Entitlements], summary: List a tenant's raw entitlement rows, responses: { '200': { $ref: '#/components/responses/EntitlementList' }, '403': { $ref: '#/components/responses/TenantAccessDenied' } } }
  /tenants/{tenant}/effective-entitlements:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get:
      tags: [Entitlements]
      summary: The tenant's merged, effective entitlements
      description: >
        Merges PLAN (base) + ADDON (delta, summed for LIMIT / OR'd for
        boolean types) + MANUAL_OVERRIDE (wins outright when present) sourced
        rows, respecting effective_from/until windows and ACTIVE status, into
        one row per (entitlement_type, entitlement_key).
      parameters: [{ name: application_code, in: query, schema: { type: string } }]
      responses:
        '200':
          description: Effective entitlements
          content: { application/json: { schema: { $ref: '#/components/schemas/EffectiveEntitlementsResponse' } } }
        '403': { $ref: '#/components/responses/TenantAccessDenied' }
  /tenants/{tenant}/entitlement-overrides:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post:
      tags: [Entitlements]
      summary: Grant a manual entitlement override for a tenant
      description: "A manual override always wins over PLAN/ADDON-sourced entitlements for the same key, until effective_until (if set)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EntitlementOverrideInput' } } } }
      responses: { '201': { $ref: '#/components/responses/EntitlementItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /tenants/{tenant}/commercial-context:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get:
      tags: [Entitlements]
      summary: A tenant's authoritative commercial state (M2M only)
      description: >
        Machine-to-machine only. Requires a client-credentials token carrying
        the `commercial.read` scope. Returns the tenant's active-like
        subscriptions, which applications are enabled, and the full effective
        entitlement set - the single source of truth an integrated
        application should poll/cache instead of re-deriving commercial state
        itself.
      security: [{ OAuth2ClientCredentials: [commercial.read] }]
      responses:
        '200': { description: Commercial context, content: { application/json: { schema: { $ref: '#/components/schemas/CommercialContextResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------------------- Usage
  /usage:
    get:
      tags: [Usage]
      summary: List usage events (admin, cross-tenant)
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: meter_key, in: query, schema: { type: string } }
        - { name: subscription_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/UsageEventList' } }
  /tenants/{tenant}/usage:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get: { tags: [Usage], summary: List a tenant's usage events, responses: { '200': { $ref: '#/components/responses/UsageEventList' }, '403': { $ref: '#/components/responses/TenantAccessDenied' } } }
  /usage-events:
    post:
      tags: [Usage]
      summary: Report a metered usage event (M2M only)
      description: >
        Machine-to-machine only. Requires a client-credentials token carrying
        the `usage.write` scope, issued to a service account whose
        application_id matches application_code (or is unscoped) and whose
        tenant has that application assigned. Idempotent: a repeat POST
        carrying the same idempotency_key returns the original event (200)
        instead of creating a duplicate charge-generating record (201) - this
        is what guarantees a duplicated/retried usage report never double-
        bills a tenant.
      security: [{ OAuth2ClientCredentials: [usage.write] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UsageEventInput' } } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/UsageEventResponse' } } } }
        '200': { description: "Idempotent replay - returns the existing event", content: { application/json: { schema: { $ref: '#/components/schemas/UsageEventResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "Application/tenant scope mismatch", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  # ------------------------------------------------------------ Billing
  /billings:
    get:
      tags: [Billing]
      summary: List billings
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: subscription_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/BillingList' } }
  /billings/{billing}:
    parameters: [{ $ref: '#/components/parameters/BillingId' }]
    get: { tags: [Billing], summary: Get a billing (with items and adjustments), responses: { '200': { $ref: '#/components/responses/BillingItem' }, '403': { $ref: '#/components/responses/TenantAccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /billing-runs:
    post:
      tags: [Billing]
      summary: Run the billing calculation engine for one subscription, or every active-like subscription (optionally scoped to a tenant)
      description: >
        Deterministic and auditable: flat/recurring, addon-recurring, and
        usage-metered (included/overage/tiered) charges are all computed
        through the shared rating engine and PostgreSQL NUMERIC arithmetic -
        never floating point. Re-running for the same subscription+period
        while not yet finalized recalculates the same DRAFT/CALCULATED
        billing row rather than creating a duplicate. Returns 201 with one
        result per matched subscription (a Billing, or {subscription_id,
        error} for one that failed, e.g. already finalized).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscription_id: { type: string, format: uuid }
                tenant_id: { type: string, format: uuid }
                period_start: { type: string, format: date-time }
                period_end: { type: string, format: date-time }
      responses:
        '201':
          description: Billing run results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingRunResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /billings/{billing}/recalculate:
    parameters: [{ $ref: '#/components/parameters/BillingId' }]
    post:
      tags: [Billing]
      summary: Recalculate a not-yet-finalized billing for the same period
      responses:
        '200': { $ref: '#/components/responses/BillingItem' }
        '409': { description: BILLING_ALREADY_FINALIZED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /billings/{billing}/review:
    parameters: [{ $ref: '#/components/parameters/BillingId' }]
    post: { tags: [Billing], summary: Mark reviewed (from DRAFT/CALCULATED), responses: { '200': { $ref: '#/components/responses/BillingItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /billings/{billing}/finalize:
    parameters: [{ $ref: '#/components/parameters/BillingId' }]
    post:
      tags: [Billing]
      summary: Finalize a billing (from CALCULATED/REVIEWED)
      description: >
        Segregation of duties: requires cgo.billing.finalize, held by
        BILLING_APPROVER but not BILLING_ADMIN (the same role that creates/
        adjusts billing). Once FINALIZED, a billing is immutable - it can
        never be recalculated, cancelled, or have its total changed again;
        corrections after this point are explicit BillingAdjustment records
        via POST /billings/{billing}/adjustments, or a full reversal via a
        new period's billing.
      responses: { '200': { $ref: '#/components/responses/BillingItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } }
  /billings/{billing}/cancel:
    parameters: [{ $ref: '#/components/parameters/BillingId' }]
    post:
      tags: [Billing]
      summary: Cancel a not-yet-finalized billing
      responses:
        '200': { $ref: '#/components/responses/BillingItem' }
        '409': { description: BILLING_ALREADY_FINALIZED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /billings/{billing}/adjustments:
    parameters: [{ $ref: '#/components/parameters/BillingId' }]
    post:
      tags: [Billing]
      summary: Add a correction/discount/credit/debit adjustment to a billing
      description: "The only way to correct a billing's total after calculation - never a direct field edit. Rejected once the billing is CANCELLED."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillingAdjustmentInput' } } } }
      responses: { '201': { $ref: '#/components/responses/BillingItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } }

  # ----------------------------------------------------------- Invoices
  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: subscription_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/PerPage'
      responses: { '200': { $ref: '#/components/responses/InvoiceList' } }
  /invoices/{invoice}:
    parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
    get: { tags: [Invoices], summary: Get an invoice (with items and payments), responses: { '200': { $ref: '#/components/responses/InvoiceItem' }, '403': { $ref: '#/components/responses/TenantAccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /invoices/generate-from-billing/{billing}:
    parameters: [{ $ref: '#/components/parameters/BillingId' }]
    post:
      tags: [Invoices]
      summary: Generate an invoice from a finalized billing
      description: >
        Only a FINALIZED billing may become an invoice. The invoice number is
        always server-generated from a PostgreSQL sequence (never client-
        supplied, never colliding under concurrency) and every financial
        field is copied/snapshotted from the billing at generation time, so
        the invoice is immutable even if the billing or its prices change
        later. At most one invoice per billing.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { net_days: { type: integer, default: 30 } } }
      responses:
        '201': { $ref: '#/components/responses/InvoiceItem' }
        '422': { description: BILLING_NOT_FINALIZED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { $ref: '#/components/responses/Duplicate' }
  /invoices/{invoice}/issue:
    parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
    post:
      tags: [Invoices]
      summary: Issue a draft invoice (from DRAFT)
      description: "Once issued, the invoice's financial snapshot is frozen - never mutated even if the source billing changes afterward."
      responses: { '200': { $ref: '#/components/responses/InvoiceItem' }, '409': { $ref: '#/components/responses/InvoiceTransitionError' } }
  /invoices/{invoice}/mark-paid:
    parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
    post:
      tags: [Invoices]
      summary: Record full payment of the remaining balance (from ISSUED/PARTIALLY_PAID/OVERDUE)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { method: { type: string, nullable: true }, reference: { type: string, nullable: true } } }
      responses: { '200': { $ref: '#/components/responses/InvoiceItem' }, '422': { $ref: '#/components/responses/InvoiceTransitionError' } }
  /invoices/{invoice}/mark-partially-paid:
    parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
    post:
      tags: [Invoices]
      summary: Record a partial payment (from ISSUED/PARTIALLY_PAID/OVERDUE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties: { amount: { type: number }, method: { type: string, nullable: true }, reference: { type: string, nullable: true } }
      responses:
        '200': { $ref: '#/components/responses/InvoiceItem' }
        '422': { description: "Amount exceeds the outstanding balance due, or invalid transition", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /invoices/{invoice}/void:
    parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
    post:
      tags: [Invoices]
      summary: Void an issued invoice (from ISSUED/PARTIALLY_PAID/OVERDUE)
      description: "Segregation of duties: requires cgo.invoice.void, held by BILLING_APPROVER but not BILLING_ADMIN (the same role that generates/records payments)."
      responses: { '200': { $ref: '#/components/responses/InvoiceItem' }, '409': { $ref: '#/components/responses/InvoiceTransitionError' } }
  /invoices/{invoice}/cancel:
    parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
    post: { tags: [Invoices], summary: Cancel a draft invoice before it is ever issued (from DRAFT only), responses: { '200': { $ref: '#/components/responses/InvoiceItem' }, '409': { $ref: '#/components/responses/InvoiceTransitionError' } } }

  # ------------------------------------------------------------- Policies
  /policies:
    get:
      tags: [Policies]
      summary: List policies
      parameters: [{ $ref: '#/components/parameters/Status' }, { name: policy_type, in: query, schema: { type: string } }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/PolicyList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Policies]
      summary: Create a policy (DRAFT)
      description: "condition_definition is validated for structural safety server-side (no eval/PHP/JS/SQL/shell) - a violation is rejected as POLICY_INVALID, not a generic VALIDATION_ERROR."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PolicyInput' } } } }
      responses: { '201': { $ref: '#/components/responses/PolicyItem' }, '422': { $ref: '#/components/responses/PolicyInvalid' } }
  /policies/simulate:
    post:
      tags: [Policies]
      summary: Simulate policy evaluation (no side effects)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PolicySimulateInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/PolicySimulationResult' } } } ] } } } } }
  /policies/{policy}:
    parameters: [{ $ref: '#/components/parameters/PolicyId' }]
    get: { tags: [Policies], summary: Get a policy, responses: { '200': { $ref: '#/components/responses/PolicyItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Policies]
      summary: Update a policy (bumps version when effect/condition/priority change)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PolicyInput' } } } }
      responses: { '200': { $ref: '#/components/responses/PolicyItem' }, '422': { $ref: '#/components/responses/PolicyInvalid' } }
  /policies/{policy}/activate:
    parameters: [{ $ref: '#/components/parameters/PolicyId' }]
    post: { tags: [Policies], summary: Activate (from DRAFT/INACTIVE), responses: { '200': { $ref: '#/components/responses/PolicyItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /policies/{policy}/deactivate:
    parameters: [{ $ref: '#/components/parameters/PolicyId' }]
    post: { tags: [Policies], summary: Deactivate (from ACTIVE), responses: { '200': { $ref: '#/components/responses/PolicyItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /policies/{policy}/deprecate:
    parameters: [{ $ref: '#/components/parameters/PolicyId' }]
    post: { tags: [Policies], summary: "Deprecate (from ACTIVE/INACTIVE, terminal)", responses: { '200': { $ref: '#/components/responses/PolicyItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /policies/{policy}/clone:
    parameters: [{ $ref: '#/components/parameters/PolicyId' }]
    post:
      tags: [Policies]
      summary: Clone into a new DRAFT policy
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [policy_code], properties: { policy_code: { type: string }, name: { type: string } } } } } }
      responses: { '201': { $ref: '#/components/responses/PolicyItem' } }

  # ------------------------------------------------------------ Workflows
  /workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      parameters: [{ $ref: '#/components/parameters/Status' }, { name: trigger_type, in: query, schema: { type: string } }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/WorkflowList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Workflows]
      summary: Create a workflow with its initial DRAFT definition (version 1)
      description: "Structural validation: unique non-empty step_key, exactly one START, at least one END, valid step_type, valid per-type config, no dangling non-END step, every step reachable from START, no invalid transition reference."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInput' } } } }
      responses: { '201': { $ref: '#/components/responses/WorkflowItem' }, '422': { $ref: '#/components/responses/WorkflowInvalid' } }
  /workflows/{workflow}:
    parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
    get: { tags: [Workflows], summary: Get a workflow (includes its draft version/steps/transitions), responses: { '200': { $ref: '#/components/responses/WorkflowItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Workflows]
      summary: Replace the DRAFT version's steps/transitions
      description: "The ACTIVE version is immutable; this always writes to (or creates) the DRAFT version, current_version + 1."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInput' } } } }
      responses: { '200': { $ref: '#/components/responses/WorkflowItem' }, '422': { $ref: '#/components/responses/WorkflowInvalid' } }
  /workflows/{workflow}/clone:
    parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
    post:
      tags: [Workflows]
      summary: Clone into a new DRAFT workflow
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [workflow_code], properties: { workflow_code: { type: string }, name: { type: string } } } } } }
      responses: { '201': { $ref: '#/components/responses/WorkflowItem' } }
  /workflows/{workflow}/validate:
    parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
    post: { tags: [Workflows], summary: Validate the DRAFT version's structure without activating it, responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { valid: { type: boolean }, errors: { type: array, items: { type: string } } } } } } ] } } } } } }
  /workflows/{workflow}/activate:
    parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
    post:
      tags: [Workflows]
      summary: Activate the DRAFT version
      description: "Re-validates the draft; on success, retires any existing ACTIVE version and promotes the draft atomically. The newly-ACTIVE version becomes immutable."
      responses: { '200': { $ref: '#/components/responses/WorkflowItem' }, '422': { $ref: '#/components/responses/WorkflowInvalid' } }
  /workflows/{workflow}/deactivate:
    parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
    post: { tags: [Workflows], summary: Deactivate (from ACTIVE), responses: { '200': { $ref: '#/components/responses/WorkflowItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /workflows/{workflow}/execute:
    parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
    post:
      tags: [Workflows]
      summary: Manually trigger a workflow instance
      description: "Requires cgo.workflow.execute. idempotency_key (if supplied) makes a repeated call with the same key return the existing instance rather than creating a duplicate."
      requestBody: { content: { application/json: { schema: { type: object, properties: { payload: { type: object }, idempotency_key: { type: string }, correlation_id: { type: string } } } } } }
      responses: { '201': { $ref: '#/components/responses/WorkflowInstanceItem' }, '422': { $ref: '#/components/responses/WorkflowNotActive' } }
  /workflow-instances:
    get:
      tags: [Workflow Instances]
      summary: List workflow instances (correlation-aware observability view)
      parameters: [{ name: workflow_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/WorkflowInstanceList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /workflow-instances/{workflowInstance}:
    parameters: [{ $ref: '#/components/parameters/WorkflowInstanceId' }]
    get: { tags: [Workflow Instances], summary: Get an instance and its full step history, responses: { '200': { $ref: '#/components/responses/WorkflowInstanceItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /workflow-instances/{workflowInstance}/retry:
    parameters: [{ $ref: '#/components/parameters/WorkflowInstanceId' }]
    post: { tags: [Workflow Instances], summary: Retry the latest FAILED step (only from FAILED), responses: { '200': { $ref: '#/components/responses/WorkflowInstanceItem' }, '409': { description: Only a FAILED instance can be retried, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } } }
  /workflow-instances/{workflowInstance}/cancel:
    parameters: [{ $ref: '#/components/parameters/WorkflowInstanceId' }]
    post: { tags: [Workflow Instances], summary: Cancel an open instance, responses: { '200': { $ref: '#/components/responses/WorkflowInstanceItem' }, '409': { description: Only an open (non-terminal) instance can be cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } } }

  # ------------------------------------------------------------ Approvals
  /approval-definitions:
    get:
      tags: [Approval Definitions]
      summary: List approval definitions
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/ApprovalDefinitionList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Approval Definitions]
      summary: Create an approval definition (DRAFT)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDefinitionInput' } } } }
      responses: { '201': { $ref: '#/components/responses/ApprovalDefinitionItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /approval-definitions/{approvalDefinition}:
    parameters: [{ $ref: '#/components/parameters/ApprovalDefinitionId' }]
    get: { tags: [Approval Definitions], summary: Get an approval definition and its levels, responses: { '200': { $ref: '#/components/responses/ApprovalDefinitionItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Approval Definitions]
      summary: Update an approval definition (including status)
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string }, status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }, self_approval_allowed: { type: boolean }, expires_after_hours: { type: integer, nullable: true } } } } } }
      responses: { '200': { $ref: '#/components/responses/ApprovalDefinitionItem' } }
  /approval-requests:
    get:
      tags: [Approval Requests]
      summary: List approval requests (correlation-aware observability view)
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/ApprovalRequestList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /approval-requests/{approvalRequest}:
    parameters: [{ $ref: '#/components/parameters/ApprovalRequestId' }]
    get: { tags: [Approval Requests], summary: Get an approval request and its decision history, responses: { '200': { $ref: '#/components/responses/ApprovalRequestItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /approval-requests/{approvalRequest}/approve:
    parameters: [{ $ref: '#/components/parameters/ApprovalRequestId' }]
    post:
      tags: [Approval Requests]
      summary: Approve the active level
      description: "Rejects self-approval (unless the definition allows it), decisions from an actor not resolved/role-matched to the active level, replay of an already-decided step, and decisions after expiry. Decisions are immutable once recorded."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionInput' } } } }
      responses: { '200': { $ref: '#/components/responses/ApprovalRequestItem' }, '403': { $ref: '#/components/responses/ApprovalDecisionError' }, '409': { $ref: '#/components/responses/ApprovalDecisionError' } }
  /approval-requests/{approvalRequest}/reject:
    parameters: [{ $ref: '#/components/parameters/ApprovalRequestId' }]
    post:
      tags: [Approval Requests]
      summary: Reject (terminates the whole request, regardless of rule_type)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionInput' } } } }
      responses: { '200': { $ref: '#/components/responses/ApprovalRequestItem' }, '403': { $ref: '#/components/responses/ApprovalDecisionError' }, '409': { $ref: '#/components/responses/ApprovalDecisionError' } }
  /approval-requests/{approvalRequest}/return:
    parameters: [{ $ref: '#/components/parameters/ApprovalRequestId' }]
    post:
      tags: [Approval Requests]
      summary: Return (terminates the whole request, regardless of rule_type)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionInput' } } } }
      responses: { '200': { $ref: '#/components/responses/ApprovalRequestItem' }, '403': { $ref: '#/components/responses/ApprovalDecisionError' }, '409': { $ref: '#/components/responses/ApprovalDecisionError' } }
  /approval-delegations:
    post:
      tags: [Approval Requests]
      summary: Create a delegation (act on behalf of another approver)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDelegationInput' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ApprovalDelegation' } } } ] } } } } }
  /approval-delegations/{approvalDelegation}:
    parameters: [{ $ref: '#/components/parameters/ApprovalDelegationId' }]
    delete: { tags: [Approval Requests], summary: Revoke a delegation (only the delegator may revoke their own), responses: { '200': { description: Revoked }, '403': { $ref: '#/components/responses/Unauthorized' } } }

  # --------------------------------------------------------- Integrations
  /integrations:
    get:
      tags: [Integrations]
      summary: List integrations
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/IntegrationList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Integrations]
      summary: Register an integration (DRAFT)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationInput' } } } }
      responses: { '201': { $ref: '#/components/responses/IntegrationItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /integrations/{integration}:
    parameters: [{ $ref: '#/components/parameters/IntegrationId' }]
    get: { tags: [Integrations], summary: "Get an integration (endpoints + whether it has an active credential, never the secret)", responses: { '200': { $ref: '#/components/responses/IntegrationItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Integrations]
      summary: Update an integration
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, base_url: { type: string }, timeout_seconds: { type: integer }, retry_policy: { type: object }, metadata: { type: object } } } } } }
      responses: { '200': { $ref: '#/components/responses/IntegrationItem' } }
  /integrations/{integration}/activate:
    parameters: [{ $ref: '#/components/parameters/IntegrationId' }]
    post: { tags: [Integrations], summary: Activate (from DRAFT/INACTIVE), responses: { '200': { $ref: '#/components/responses/IntegrationItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /integrations/{integration}/deactivate:
    parameters: [{ $ref: '#/components/parameters/IntegrationId' }]
    post: { tags: [Integrations], summary: Deactivate (from ACTIVE), responses: { '200': { $ref: '#/components/responses/IntegrationItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /integrations/{integration}/test:
    parameters: [{ $ref: '#/components/parameters/IntegrationId' }]
    post:
      tags: [Integrations]
      summary: Synchronous connectivity test
      description: "Runs through the same SSRF-protected client as real deliveries (scheme/host allowlist, private/reserved IP blocking, DNS-rebinding-safe IP pinning, redirects disabled). Always returns 200 - ok:false describes the failure, it is not itself an error response."
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/IntegrationTestResult' } } } ] } } } } }
  /integrations/{integration}/logs:
    parameters: [{ $ref: '#/components/parameters/IntegrationId' }]
    get: { tags: [Integrations], summary: Paginated delivery log, parameters: [{ $ref: '#/components/parameters/PerPage' }], responses: { '200': { $ref: '#/components/responses/IntegrationLogList' } } }
  /integrations/{integration}/credentials:
    parameters: [{ $ref: '#/components/parameters/IntegrationId' }]
    post:
      tags: [Integrations]
      summary: Create/replace the active credential
      description: "Encrypted at rest immediately (AES-256, Laravel's encrypted cast). Never returned in plaintext by this or any other endpoint after this call."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationCredentialInput' } } } }
      responses: { '201': { $ref: '#/components/responses/IntegrationCredentialItem' } }
  /integrations/{integration}/credentials/rotate:
    parameters: [{ $ref: '#/components/parameters/IntegrationId' }]
    post:
      tags: [Integrations]
      summary: Rotate the active credential
      description: "Atomically marks the current ACTIVE credential ROTATED and creates the new one ACTIVE - a DB-level partial unique index guarantees at most one ACTIVE credential per integration at any time."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationCredentialInput' } } } }
      responses: { '201': { $ref: '#/components/responses/IntegrationCredentialItem' } }
  /integrations/{integration}/credentials/revoke:
    parameters: [{ $ref: '#/components/parameters/IntegrationId' }]
    post: { tags: [Integrations], summary: Revoke the active credential, responses: { '200': { $ref: '#/components/responses/IntegrationCredentialItem' }, '409': { $ref: '#/components/responses/Duplicate' } } }

  # -------------------------------------------------------------- Events
  /event-catalog:
    get:
      tags: [Events]
      summary: List registered event types
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/EventCatalogEntryList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Events]
      summary: Register an event type
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventCatalogEntryInput' } } } }
      responses: { '201': { $ref: '#/components/responses/EventCatalogEntryItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /event-catalog/{eventCatalogEntry}:
    parameters: [{ $ref: '#/components/parameters/EventCatalogEntryId' }]
    get: { tags: [Events], summary: Get an event type and its payload schema, responses: { '200': { $ref: '#/components/responses/EventCatalogEntryItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Events], summary: Update an event type (e.g. status), requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string }, status: { type: string, enum: [ACTIVE, DEPRECATED, DISABLED] } } } } } }, responses: { '200': { $ref: '#/components/responses/EventCatalogEntryItem' } } }
  /events:
    post:
      tags: [Events]
      summary: Ingest an event (trusted M2M only)
      description: "Machine-to-machine only, via a client-credentials token with the event.write scope - never a human session, so an arbitrary user can never impersonate a producer. Enforces trusted application identity, tenant-application assignment, schema validation, a 64KB payload limit, and idempotency by event_id."
      security: [{ OAuth2ClientCredentials: [event.write] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventEnvelope' } } } }
      responses: { '201': { $ref: '#/components/responses/EventItem' }, '200': { description: "Idempotent replay of an already-ingested event_id", content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Event' } } } ] } } } }, '403': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/EventDuplicate' }, '422': { $ref: '#/components/responses/EventInvalid' } }
  /event-deliveries:
    get:
      tags: [Event Deliveries]
      summary: List event deliveries (correlation/consumer-aware observability view)
      parameters: [{ name: event_id, in: query, schema: { type: string, format: uuid } }, { name: consumer_type, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/EventDeliveryList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /event-deliveries/{delivery}:
    parameters: [{ $ref: '#/components/parameters/EventDeliveryId' }]
    get: { tags: [Event Deliveries], summary: Get a delivery, responses: { '200': { $ref: '#/components/responses/EventDeliveryItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /event-deliveries/{delivery}/retry:
    parameters: [{ $ref: '#/components/parameters/EventDeliveryId' }]
    post: { tags: [Event Deliveries], summary: Retry a FAILED delivery, responses: { '200': { $ref: '#/components/responses/EventDeliveryItem' }, '409': { description: Only a FAILED delivery can be retried, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } } }
  /event-deliveries/{delivery}/discard:
    parameters: [{ $ref: '#/components/parameters/EventDeliveryId' }]
    post: { tags: [Event Deliveries], summary: "Discard a delivery (never silent - always an explicit, audited action)", responses: { '200': { $ref: '#/components/responses/EventDeliveryItem' }, '409': { description: "A DELIVERED or already-DISCARDED delivery cannot be discarded", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } } }

  # --------------------------------------------------------- Feature Flags
  /feature-flags:
    get:
      tags: [Feature Flags]
      summary: List feature flags
      parameters: [{ $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/FeatureFlagList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Feature Flags]
      summary: Create a feature flag (DRAFT)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagInput' } } } }
      responses: { '201': { $ref: '#/components/responses/FeatureFlagItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /feature-flags/evaluate:
    post:
      tags: [Feature Flags]
      summary: Evaluate effective availability for a tenant/user
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagEvaluateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/FeatureFlagEvaluation' }, '404': { $ref: '#/components/responses/FeatureFlagNotFound' } }
  /feature-flags/{featureFlag}:
    parameters: [{ $ref: '#/components/parameters/FeatureFlagId' }]
    get: { tags: [Feature Flags], summary: Get a feature flag and its overrides, responses: { '200': { $ref: '#/components/responses/FeatureFlagItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Feature Flags], summary: Update a feature flag, requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string }, default_value: {} } } } } }, responses: { '200': { $ref: '#/components/responses/FeatureFlagItem' } } }
  /feature-flags/{featureFlag}/activate:
    parameters: [{ $ref: '#/components/parameters/FeatureFlagId' }]
    post: { tags: [Feature Flags], summary: Activate (from DRAFT/INACTIVE), responses: { '200': { $ref: '#/components/responses/FeatureFlagItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /feature-flags/{featureFlag}/deactivate:
    parameters: [{ $ref: '#/components/parameters/FeatureFlagId' }]
    post: { tags: [Feature Flags], summary: "Deactivate (from ACTIVE - always evaluates enabled:false while deactivated)", responses: { '200': { $ref: '#/components/responses/FeatureFlagItem' }, '409': { $ref: '#/components/responses/InvalidStateTransition' } } }
  /feature-flags/{featureFlag}/overrides:
    parameters: [{ $ref: '#/components/parameters/FeatureFlagId' }]
    post:
      tags: [Feature Flags]
      summary: Add or replace a scoped override
      description: "A TENANT-scoped override cannot target a tenant unrelated to the flag's own application (no cross-tenant override leakage)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagOverrideInput' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/FeatureFlagOverride' } } } ] } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /feature-flags/{featureFlag}/overrides/{override}:
    parameters: [{ $ref: '#/components/parameters/FeatureFlagId' }, { $ref: '#/components/parameters/FeatureFlagOverrideId' }]
    delete: { tags: [Feature Flags], summary: Remove an override, responses: { '200': { description: Removed }, '404': { $ref: '#/components/responses/NotFound' } } }

  # -------------------------------------------------------- Notifications
  /notification-templates:
    get:
      tags: [Notifications]
      summary: List notification templates
      parameters: [{ name: channel, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/NotificationTemplateList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Notifications]
      summary: Create a template (DRAFT)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplateInput' } } } }
      responses: { '201': { $ref: '#/components/responses/NotificationTemplateItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /notification-templates/{notificationTemplate}:
    parameters: [{ $ref: '#/components/parameters/NotificationTemplateId' }]
    get: { tags: [Notifications], summary: Get a template, responses: { '200': { $ref: '#/components/responses/NotificationTemplateItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put:
      tags: [Notifications]
      summary: Update a template (editing content bumps version)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplateUpdateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/NotificationTemplateItem' } }
  /notification-rules:
    get:
      tags: [Notifications]
      summary: List notification rules
      parameters: [{ name: trigger_event_key, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/NotificationRuleList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Notifications]
      summary: Create a rule (ACTIVE)
      description: "channel must match the selected template's channel; EVENT_CONTEXT recipient_reference must start with data. (only the trusted event payload, never actor/context, to prevent an external producer redirecting notifications to unrelated tenants/users)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationRuleInput' } } } }
      responses: { '201': { $ref: '#/components/responses/NotificationRuleItem' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /notification-rules/{notificationRule}:
    parameters: [{ $ref: '#/components/parameters/NotificationRuleId' }]
    get: { tags: [Notifications], summary: Get a rule, responses: { '200': { $ref: '#/components/responses/NotificationRuleItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Notifications], summary: Update a rule (e.g. status/condition), requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, condition: { $ref: '#/components/schemas/ConditionDefinition' }, recipient_reference: { type: string }, status: { type: string, enum: [ACTIVE, INACTIVE] } } } } } }, responses: { '200': { $ref: '#/components/responses/NotificationRuleItem' } } }
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications (correlation-aware delivery log)
      parameters: [{ $ref: '#/components/parameters/Status' }, { name: channel, in: query, schema: { type: string } }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { $ref: '#/components/responses/NotificationList' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /notifications/send:
    post:
      tags: [Notifications]
      summary: Send a notification directly (elevated permission)
      description: "Bypasses rule/trigger resolution - recipients and tenant are supplied explicitly. Rejects any recipient who does not belong to a supplied tenant_id (no cross-tenant recipient leakage)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSendInput' } } } }
      responses: { '201': { $ref: '#/components/responses/NotificationSendResult' }, '422': { description: NOTIFICATION_TEMPLATE_INVALID or a rejected recipient, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } }
  /notifications/{notification}:
    parameters: [{ $ref: '#/components/parameters/NotificationId' }]
    get: { tags: [Notifications], summary: Get a notification and its delivery attempts, responses: { '200': { $ref: '#/components/responses/NotificationItem' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /notifications/{notification}/retry:
    parameters: [{ $ref: '#/components/parameters/NotificationId' }]
    post: { tags: [Notifications], summary: Retry (only from FAILED), responses: { '200': { $ref: '#/components/responses/NotificationItem' }, '409': { description: NOTIFICATION_NOT_RETRYABLE, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } } }
  /notifications/{notification}/cancel:
    parameters: [{ $ref: '#/components/parameters/NotificationId' }]
    post: { tags: [Notifications], summary: Cancel (only while QUEUED/PROCESSING), responses: { '200': { $ref: '#/components/responses/NotificationItem' }, '409': { description: NOTIFICATION_NOT_CANCELLABLE, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } } }

  # -------------------------------------------------------------- Access
  /access/evaluate:
    post:
      tags: [Access]
      summary: Aggregated effective-access evaluation (trusted M2M only)
      description: >
        Combines Authentication -> Tenant/App Context -> Subscription/
        Entitlement -> RBAC Permission -> Policy -> Feature Flag into one
        decision, reusing each domain's own service. Every sub-check is
        always computed and reported (never short-circuited); `allowed`
        is their conjunction. Never exposes matched-policy detail or
        role/permission internals to the caller.
      security: [{ OAuth2ClientCredentials: [access.evaluate] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccessEvaluateInput' } } } }
      responses: { '200': { $ref: '#/components/responses/AccessEvaluationResult' }, '403': { $ref: '#/components/responses/Unauthorized' } }
  # ------------------------------------------- Platform integration (SSO)
  /.well-known/openid-configuration:
    servers: [{ url: "https://cgo.example.com", description: "OptiNexus root (not under /api/v1)" }]
    get:
      tags: [SSO]
      summary: OpenID Connect discovery document
      description: Standard discovery metadata. Relying parties configure themselves from this document.
      security: []
      responses:
        '200': { description: Discovery document, content: { application/json: { schema: { $ref: '#/components/schemas/OidcDiscovery' } } } }
  /oidc/jwks:
    servers: [{ url: "https://cgo.example.com" }]
    get:
      tags: [SSO]
      summary: Public signing keys (JWKS)
      description: RS256 public key used to verify `id_token` signatures. Cache for up to 5 minutes and refetch on an unknown `kid`.
      security: []
      responses:
        '200': { description: JSON Web Key Set }
  /oidc/authorize:
    servers: [{ url: "https://cgo.example.com" }]
    get:
      tags: [SSO]
      summary: Start sign-in (authorization code flow)
      description: |
        Browser redirect endpoint. If the user already has an OptiNexus session (from signing in to another
        application) the code is issued immediately - this is the single sign-on hop. Otherwise the user signs in
        on OptiNexus first. Access is granted only when ALL hold: the user is ACTIVE, has an ACTIVE membership of
        an ACTIVE tenant, the tenant has the application assigned and ACTIVE (its subscription outcome), and the
        user has ACTIVE access to the application in that tenant. Otherwise the browser is redirected back with
        `error=access_denied`.

        Redirect URIs are matched exactly. Public clients (no secret) and clients with `require_pkce` must send
        a PKCE `S256` challenge.
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string, example: "openid profile email" }, description: "Must include `openid`." }
        - { name: state, in: query, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string } }
        - { name: code_challenge, in: query, schema: { type: string } }
        - { name: code_challenge_method, in: query, schema: { type: string, enum: [S256] } }
        - { name: tenant_hint, in: query, schema: { type: string }, description: "Tenant id or tenant_code; skips the organization picker when the user belongs to several." }
        - { name: prompt, in: query, schema: { type: string, enum: [none, login] } }
      responses:
        '302': { description: "Redirect to `redirect_uri` with `code` + `state` + `iss`, or `error` (access_denied, login_required, invalid_scope, invalid_request)" }
        '400': { description: "Unknown client or unregistered redirect URI (shown to the user, never redirected)" }
  /api/oidc/token:
    servers: [{ url: "https://cgo.example.com" }]
    post:
      tags: [SSO]
      summary: Exchange an authorization code for tokens
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, redirect_uri]
              properties:
                grant_type: { type: string, enum: [authorization_code] }
                code: { type: string }
                redirect_uri: { type: string, format: uri }
                client_id: { type: string, description: "Or HTTP Basic" }
                client_secret: { type: string }
                code_verifier: { type: string, description: "PKCE verifier (43-128 chars)" }
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/OidcTokenResponse' } } } }
        '400': { description: "invalid_grant (expired, replayed, wrong redirect_uri or PKCE verifier), access_denied (access revoked since sign-in), invalid_request" }
        '401': { description: invalid_client }
  /api/oidc/userinfo:
    servers: [{ url: "https://cgo.example.com" }]
    get:
      tags: [SSO]
      summary: Current identity and tenant context
      description: Access is re-checked on every call, so a revoked user or lapsed subscription stops working at the next refresh.
      security: [{ OidcAccessToken: [] }]
      responses:
        '200': { description: Claims, content: { application/json: { schema: { $ref: '#/components/schemas/OidcClaims' } } } }
        '401': { description: invalid_token }
  /oidc/logout:
    servers: [{ url: "https://cgo.example.com" }]
    get:
      tags: [SSO]
      summary: End the OptiNexus session and sign the user out of every application
      description: "Central logout. The user is the one signed in at OptiNexus, or the one named by a valid `id_token_hint`. Every application the user is signed in to receives a Back-Channel Logout call (`logout_token`, no access-revoked event). The user's account in those applications stays active."
      security: []
      parameters:
        - { name: client_id, in: query, schema: { type: string } }
        - { name: id_token_hint, in: query, schema: { type: string } }
        - { name: post_logout_redirect_uri, in: query, schema: { type: string, format: uri }, description: "Honoured only when registered on the client." }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '302': { description: Redirect to the registered post-logout URI }
        '200': { description: Signed-out page }
  /oidc-clients:
    get:
      tags: [SSO Clients]
      summary: List SSO clients
      description: "Permission `cgo.sso.client.view`."
      parameters: [{ name: application_id, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
    post:
      tags: [SSO Clients]
      summary: Register an SSO client for an application
      description: "Permission `cgo.sso.client.manage`. The `client_secret` is returned once and stored only as a hash. `confidential: false` creates a public (PKCE-only) client."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OidcClientInput' }
            example:
              application_id: "0699b1b1-6b1a-4e21-9a8e-7a9a6a2c6b31"
              name: OptiRadar
              redirect_uris: ["https://radar.example.com/api/session/openid/callback"]
              post_logout_redirect_uris: ["https://radar.example.com/"]
              launch_url: "https://radar.example.com/"
      responses:
        '201': { description: Created (includes one-time client_secret) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /oidc-clients/{oidcClient}:
    parameters: [{ name: oidcClient, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [SSO Clients], summary: Get an SSO client, responses: { '200': { description: OK } } }
    put: { tags: [SSO Clients], summary: Update redirect URIs, back-channel logout URI, name or PKCE policy, responses: { '200': { description: OK } } }
  /oidc-clients/{oidcClient}/rotate-secret:
    parameters: [{ name: oidcClient, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [SSO Clients], summary: Rotate the client secret (shown once), responses: { '200': { description: OK } } }
  /oidc-clients/{oidcClient}/revoke:
    parameters: [{ name: oidcClient, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { tags: [SSO Clients], summary: Revoke the client and all its access tokens, responses: { '200': { description: OK } } }

  # ------------------------------------------- Platform integration (Gateway)
  /fleet/vehicles:
    servers: [{ url: "https://cgo.example.com/api/gateway/v1", description: API Gateway }]
    put:
      tags: [Gateway]
      summary: Publish the fleet vehicle directory
      description: |
        A fleet application (OptiFleet) publishes its vehicles so telematics devices can be matched to them.
        Idempotent upsert by `id`. Devices already seen but unmatched are linked automatically when the
        registration number (case, spaces and dashes ignored) matches exactly one vehicle.
      security: [{ OAuth2ClientCredentials: [gateway.fleet.write] }]
      parameters: [{ $ref: '#/components/parameters/GatewayTenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayPublishVehicles' }
            example: { vehicles: [{ id: "6f1c...", registration_number: "B 1234 XYZ", vin: "MHKA1BA1JFK000001" }] }
      responses:
        '200': { description: "{ upserted, linked }" }
        '403': { $ref: '#/components/responses/GatewayTenantError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /vehicle-links:
    servers: [{ url: "https://cgo.example.com/api/gateway/v1" }]
    get:
      tags: [Gateway]
      summary: Vehicles of the caller linked to a telematics device
      security: [{ OAuth2ClientCredentials: [gateway.fleet.read] }]
      parameters: [{ $ref: '#/components/parameters/GatewayTenantHeader' }]
      responses:
        '200': { description: Links }
        '403': { $ref: '#/components/responses/GatewayTenantError' }
  /telematics/odometer-readings:
    servers: [{ url: "https://cgo.example.com/api/gateway/v1" }]
    post:
      tags: [Gateway]
      summary: Push odometer readings (telematics producer)
      description: |
        Idempotent on (tenant, source, device_ref, recorded_at). The source is the calling application's code.
        Unknown devices are stored as UNMATCHED and linked later. The OptiRadar connector inside OptiNexus
        uses the same service, so a telematics app may either push here or be pulled.
      security: [{ OAuth2ClientCredentials: [gateway.telematics.write] }]
      parameters: [{ $ref: '#/components/parameters/GatewayTenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayIngestReadings' }
      responses:
        '202': { description: "{ accepted, duplicates }" }
        '403': { $ref: '#/components/responses/GatewayTenantError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Gateway]
      summary: Pull the odometer feed for the caller's linked vehicles
      description: |
        Ordered by feed position. Persist `next_cursor` and send it back as `cursor`. A reading may be
        re-delivered with a new position when its device is linked later, so consumers must be idempotent on
        `reading_id`. Odometer is in kilometres as a decimal string.
      security: [{ OAuth2ClientCredentials: [gateway.telematics.read] }]
      parameters:
        - { $ref: '#/components/parameters/GatewayTenantHeader' }
        - { name: cursor, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200': { description: Feed page, content: { application/json: { schema: { $ref: '#/components/schemas/GatewayFeed' } } } }
        '403': { $ref: '#/components/responses/GatewayTenantError' }
  /gateway/tenants/{tenant}/vehicle-links:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get:
      tags: [Gateway Admin]
      summary: Vehicle <-> device links of a tenant (including UNMATCHED devices)
      description: "Permission `cgo.gateway.link.view`."
      parameters: [{ $ref: '#/components/parameters/Status' }]
      responses: { '200': { description: OK } }
  /gateway/tenants/{tenant}/vehicle-links/{link}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: link, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Gateway Admin]
      summary: Link a device to a fleet vehicle manually
      description: "Permission `cgo.gateway.link.manage`. Manual links are never changed by automatic matching."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fleet_vehicle_id], properties: { fleet_vehicle_id: { type: string, format: uuid } } } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Gateway Admin]
      summary: Detach a device from its vehicle
      description: "Permission `cgo.gateway.link.manage`."
      responses: { '200': { description: OK } }
  /gateway/tenants/{tenant}/fleet-vehicles:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get: { tags: [Gateway Admin], summary: Fleet vehicles published to the gateway, responses: { '200': { description: OK } } }
  /gateway/tenants/{tenant}/request-logs:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get: { tags: [Gateway Admin], summary: Recent gateway calls for the tenant, responses: { '200': { description: OK } } }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: "Human user session token from POST /auth/login"
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes:
            authorization.check: Evaluate authorization decisions for a user
            governance.read: Read tenant/application/capability/permission/user directory data
            audit.write: Submit audit events on behalf of an integrated application
            introspect: Validate CGO-issued tokens
            entitlement.check: "Phase 2 — evaluate entitlement decisions for a tenant"
            commercial.read: "Phase 2 — read a tenant's commercial context (plan, status, entitlements, billing period)"
            usage.write: "Phase 2 — submit metered usage events on behalf of an integrated application"
            event.write: "Phase 3 — submit orchestration events (facts) on behalf of an integrated application"
            access.evaluate: "Phase 3 — evaluate aggregated effective access (entitlement + permission + policy + feature flag)"
            gateway.fleet.write: "Gateway — publish the fleet vehicle directory"
            gateway.fleet.read: "Gateway — read vehicle <-> telematics device links"
            gateway.telematics.write: "Gateway — push telematics odometer readings"
            gateway.telematics.read: "Gateway — read the odometer feed for linked vehicles"
    OidcAccessToken:
      type: http
      scheme: bearer
      description: "Opaque access token from POST /api/oidc/token, for GET /api/oidc/userinfo only"

  parameters:
    CustomerId: { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
    TenantId: { name: tenant, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: application, in: path, required: true, schema: { type: string, format: uuid } }
    CapabilityId: { name: capability, in: path, required: true, schema: { type: string, format: uuid } }
    PermissionId: { name: permission, in: path, required: true, schema: { type: string, format: uuid } }
    RoleId: { name: role, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: user, in: path, required: true, schema: { type: string, format: uuid } }
    Status: { name: status, in: query, schema: { type: string } }
    Search: { name: search, in: query, schema: { type: string } }
    Sort: { name: sort, in: query, schema: { type: string }, description: "Prefix with - for descending, e.g. -created_at" }
    PerPage: { name: per_page, in: query, schema: { type: integer, default: 15, maximum: 100 } }
    SubscriptionId: { name: subscription, in: path, required: true, schema: { type: string, format: uuid } }
    BillingId: { name: billing, in: path, required: true, schema: { type: string, format: uuid } }
    InvoiceId: { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
    PolicyId: { name: policy, in: path, required: true, schema: { type: string, format: uuid } }
    WorkflowId: { name: workflow, in: path, required: true, schema: { type: string, format: uuid } }
    WorkflowInstanceId: { name: workflowInstance, in: path, required: true, schema: { type: string, format: uuid } }
    ApprovalDefinitionId: { name: approvalDefinition, in: path, required: true, schema: { type: string, format: uuid } }
    ApprovalRequestId: { name: approvalRequest, in: path, required: true, schema: { type: string, format: uuid } }
    ApprovalDelegationId: { name: approvalDelegation, in: path, required: true, schema: { type: string, format: uuid } }
    IntegrationId: { name: integration, in: path, required: true, schema: { type: string, format: uuid } }
    EventCatalogEntryId: { name: eventCatalogEntry, in: path, required: true, schema: { type: string, format: uuid } }
    EventDeliveryId: { name: delivery, in: path, required: true, schema: { type: string, format: uuid } }
    FeatureFlagId: { name: featureFlag, in: path, required: true, schema: { type: string, format: uuid } }
    FeatureFlagOverrideId: { name: override, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationTemplateId: { name: notificationTemplate, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationRuleId: { name: notificationRule, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notification, in: path, required: true, schema: { type: string, format: uuid } }
    CorrelationId: { name: correlation_id, in: query, schema: { type: string } }
    GatewayTenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: "Required only for service accounts that are not bound to a tenant. A tenant-bound account always acts for its own tenant; naming another tenant returns 403 TENANT_MISMATCH."

  responses:
    GatewayTenantError:
      description: "Tenant refused: TENANT_MISMATCH, TENANT_NOT_SUBSCRIBED (unknown/inactive tenant or application not assigned), APPLICATION_REQUIRED. TENANT_REQUIRED is returned as 422."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing or invalid credentials
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: UNAUTHENTICATED, message: "Authentication is required to access this resource." } } } }
    Unauthorized:
      description: Authenticated but not permitted
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: UNAUTHORIZED, message: "You do not have the required permission." } } } }
    TenantAccessDenied:
      description: Not a member of the requested tenant
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: TENANT_ACCESS_DENIED, message: "You do not have the required permission for this tenant." } } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: RESOURCE_NOT_FOUND, message: "The requested resource could not be found." } } } }
    ValidationError:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: VALIDATION_ERROR, message: "The request contains invalid data.", details: { field: ["reason"] } } } } }
    InvalidStateTransition:
      description: The requested lifecycle transition is not allowed from the current status
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: INVALID_STATE_TRANSITION, message: "Cannot transition from [ACTIVE] to [PROVISIONING]." } } } }
    Duplicate:
      description: Resource already exists / already assigned
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: DUPLICATE_RESOURCE, message: "This resource already exists." } } } }
    CustomerList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedCustomers' } } } }
    CustomerItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } ] } } } }
    TenantList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedTenants' } } } }
    TenantItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Tenant' } } } ] } } } }
    ApplicationList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedApplications' } } } }
    ApplicationItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Application' } } } ] } } } }
    PermissionList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedPermissions' } } } }
    PermissionItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Permission' } } } ] } } } }
    RoleList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedRoles' } } } }
    RoleItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Role' } } } ] } } } }
    UserList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedUsers' } } } }
    UserItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } ] } } } }

    SubscriptionTransitionError:
      description: >
        PLAN_NOT_ACTIVE / PRODUCT_NOT_ACTIVE / PLAN_HAS_NO_TRIAL /
        INVALID_SUBSCRIPTION_TRANSITION. INVALID_SUBSCRIPTION_TRANSITION
        covers every "wrong current state" case uniformly, including what a
        client might expect as SUBSCRIPTION_ALREADY_ACTIVE (activating an
        already-ACTIVE subscription) or SUBSCRIPTION_EXPIRED (acting on an
        EXPIRED one) - see the Error Code Compliance Mapping note above.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: INVALID_SUBSCRIPTION_TRANSITION, message: "This transition is not allowed from the subscription's current state." } } } }
    InvoiceTransitionError:
      description: >
        INVALID_INVOICE_TRANSITION - also the code returned for any
        mutation attempted on an already-issued (financially locked)
        invoice, since no generic update endpoint exists for Invoice; see
        the Error Code Compliance Mapping note above (FINANCIAL_RECORD_LOCKED).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: INVALID_INVOICE_TRANSITION, message: "Only a draft invoice can be issued." } } } }
    ProductList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedProducts' } } } }
    ProductItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } ] } } } }
    PlanList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedPlans' } } } }
    PlanItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Plan' } } } ] } } } }
    AddonList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedAddons' } } } }
    AddonItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Addon' } } } ] } } } }
    PriceList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedPrices' } } } }
    PriceItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Price' } } } ] } } } }
    SubscriptionList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedSubscriptions' } } } }
    SubscriptionItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } } ] } } } }
    EntitlementList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEntitlements' } } } }
    EntitlementItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Entitlement' } } } ] } } } }
    UsageEventList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedUsageEvents' } } } }
    BillingList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedBillings' } } } }
    BillingItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Billing' } } } ] } } } }
    InvoiceList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedInvoices' } } } }
    InvoiceItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } ] } } } }

    PolicyList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedPolicies' } } } }
    PolicyItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Policy' } } } ] } } } }
    PolicyInvalid: { description: Structurally unsafe or malformed condition_definition, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: POLICY_INVALID, message: "The condition_definition is invalid." } } } } }
    WorkflowList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedWorkflows' } } } }
    WorkflowItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Workflow' } } } ] } } } }
    WorkflowInvalid: { description: The workflow definition failed structural validation, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: WORKFLOW_INVALID, message: "The workflow definition is invalid.", details: { errors: ["Exactly one START step is required."] } } } } } }
    WorkflowNotActive: { description: The workflow is not ACTIVE and cannot be triggered, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: WORKFLOW_NOT_ACTIVE, message: "This workflow could not be triggered." } } } } }
    WorkflowInstanceList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedWorkflowInstances' } } } }
    WorkflowInstanceItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/WorkflowInstance' } } } ] } } } }
    ApprovalDefinitionList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedApprovalDefinitions' } } } }
    ApprovalDefinitionItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ApprovalDefinition' } } } ] } } } }
    ApprovalRequestList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedApprovalRequests' } } } }
    ApprovalRequestItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ApprovalRequest' } } } ] } } } }
    ApprovalDecisionError: { description: APPROVAL_NOT_PENDING / APPROVAL_NOT_ALLOWED / SELF_APPROVAL_DENIED / APPROVAL_EXPIRED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: SELF_APPROVAL_DENIED, message: "You cannot approve a request you submitted yourself." } } } } }
    IntegrationList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedIntegrations' } } } }
    IntegrationItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Integration' } } } ] } } } }
    IntegrationCredentialItem: { description: "Never includes the secret - metadata only", content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/IntegrationCredential' } } } ] } } } }
    IntegrationLogList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedIntegrationLogs' } } } }
    EventCatalogEntryList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEventCatalogEntries' } } } }
    EventCatalogEntryItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/EventCatalogEntry' } } } ] } } } }
    EventItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Event' } } } ] } } } }
    EventInvalid: { description: EVENT_INVALID / EVENT_SCHEMA_INVALID / EVENT_SOURCE_DENIED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: EVENT_SCHEMA_INVALID, message: "The event payload does not match the registered schema.", details: { errors: ["remaining_days is required."] } } } } } }
    EventDuplicate: { description: "Same event_id previously used for a different payload", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: EVENT_DUPLICATE, message: "event_id already used for a different event." } } } } }
    EventDeliveryList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEventDeliveries' } } } }
    EventDeliveryItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/EventDelivery' } } } ] } } } }
    FeatureFlagList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedFeatureFlags' } } } }
    FeatureFlagItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/FeatureFlag' } } } ] } } } }
    FeatureFlagNotFound: { description: No feature flag exists for the given flag_key, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' }, example: { success: false, error: { code: FEATURE_FLAG_NOT_FOUND, message: "No feature flag exists for this flag_key." } } } } }
    FeatureFlagEvaluation: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/FeatureFlagEvaluation' } } } ] } } } }
    NotificationTemplateList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedNotificationTemplates' } } } }
    NotificationTemplateItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/NotificationTemplate' } } } ] } } } }
    NotificationRuleList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedNotificationRules' } } } }
    NotificationRuleItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/NotificationRule' } } } ] } } } }
    NotificationList: { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedNotifications' } } } }
    NotificationItem: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Notification' } } } ] } } } }
    NotificationSendResult: { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } ] } } } }
    AccessEvaluationResult:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/AccessEvaluation' } }
          example: { success: true, data: { allowed: true, checks: { entitlement: true, permission: true, policy: true, feature_flag: true }, reason_code: null } }
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta: { type: object }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - UNAUTHORIZED
                - TENANT_ACCESS_DENIED
                - APPLICATION_ACCESS_DENIED
                - VALIDATION_ERROR
                - RESOURCE_NOT_FOUND
                - INVALID_STATE_TRANSITION
                - DUPLICATE_RESOURCE
                - PRIVILEGE_ESCALATION_DENIED
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL_ERROR
                - PRODUCT_NOT_ACTIVE
                - PLAN_NOT_ACTIVE
                - TENANT_CUSTOMER_MISMATCH
                - PLAN_HAS_NO_TRIAL
                - INVALID_SUBSCRIPTION_TRANSITION
                - BILLING_ALREADY_FINALIZED
                - BILLING_NOT_FINALIZED
                - INVALID_INVOICE_TRANSITION
                - POLICY_INVALID
                - POLICY_DENIED
                - POLICY_NOT_ACTIVE
                - WORKFLOW_INVALID
                - WORKFLOW_NOT_ACTIVE
                - WORKFLOW_INSTANCE_FAILED
                - WORKFLOW_ALREADY_COMPLETED
                - WORKFLOW_STEP_FAILED
                - APPROVAL_NOT_PENDING
                - APPROVAL_NOT_ALLOWED
                - SELF_APPROVAL_DENIED
                - APPROVAL_EXPIRED
                - INTEGRATION_NOT_ACTIVE
                - INTEGRATION_AUTH_FAILED
                - INTEGRATION_TIMEOUT
                - INTEGRATION_DELIVERY_FAILED
                - EVENT_INVALID
                - EVENT_SCHEMA_INVALID
                - EVENT_DUPLICATE
                - EVENT_SOURCE_DENIED
                - EVENT_DELIVERY_FAILED
                - FEATURE_FLAG_NOT_FOUND
                - FEATURE_FLAG_SCOPE_DENIED
                - NOTIFICATION_TEMPLATE_INVALID
                - NOTIFICATION_RECIPIENT_DENIED
                - NOTIFICATION_DELIVERY_FAILED
                - NOTIFICATION_NOT_RETRYABLE
                - NOTIFICATION_NOT_CANCELLABLE
                - IDEMPOTENCY_CONFLICT
            message: { type: string }
            details: { nullable: true }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_code: { type: string }
        legal_name: { type: string }
        business_name: { type: string, nullable: true }
        tax_id: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        billing_address: { type: object, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, TERMINATED, ARCHIVED] }
        metadata: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [customer_code, legal_name]
      properties:
        customer_code: { type: string }
        legal_name: { type: string }
        business_name: { type: string }
        tax_id: { type: string }
        industry: { type: string }
        email: { type: string }
        phone: { type: string }
        billing_address: { type: object }
        metadata: { type: object }
    PaginatedCustomers:
